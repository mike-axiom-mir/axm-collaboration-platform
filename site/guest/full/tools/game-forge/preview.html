<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Forge Preview</title><style>
:root{--bg:#040811;--panel:#0b1522;--line:#253b50;--text:#eef7ff;--muted:#8497ab;--cy:#39dff2;--green:#65e19a;--gold:#f1bd59;--red:#ef7474}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -15%,#173755,transparent 50%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif}body{display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.hud{height:64px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:9px 18px;border-bottom:1px solid var(--line);background:rgba(7,14,24,.94)}.hud h1{font-size:17px;margin:0}.hud small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.stats{display:flex;gap:8px}.stats span{border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);font:800 9px ui-monospace,monospace}.stage{min-height:0;display:grid;place-items:center;padding:18px;overflow:auto}.board-wrap{position:relative}.board{width:min(900px,90vw);display:grid;grid-template-columns:repeat(16,1fr);gap:3px;padding:12px;border:1px solid #31516d;border-radius:18px;background:#07101a;box-shadow:0 30px 80px rgba(0,0,0,.45)}.tile{position:relative;aspect-ratio:1;border:1px solid #1e3346;border-radius:5px;background:#0b1621;display:grid;place-items:center;transition:transform .12s,box-shadow .12s}.tile.ground{background:#273a2b}.tile.wall{background:#465362;border-color:#66798d}.tile.water{background:#123d5b}.tile.spawn{background:#145345}.tile.goal{background:#634821}.tile.hazard{background:#5c202b}.tile.path{background:#42372b}.board.mode3d .tile{transform:translateY(calc(var(--h) * -2px));box-shadow:0 calc(var(--h) * 2px) 0 #05080d}.height{position:absolute;right:3px;top:2px;color:#9cb1c4;font:700 7px ui-monospace,monospace}.player{width:54%;height:54%;border-radius:35% 35% 45% 45%;background:linear-gradient(145deg,#dffcff,var(--cy));border:2px solid white;box-shadow:0 0 16px var(--cy);z-index:2}.message{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.message b{display:none;padding:14px 20px;border:1px solid var(--gold);border-radius:12px;background:rgba(5,10,18,.92);color:var(--gold);font-size:21px;box-shadow:0 0 30px rgba(241,189,89,.2)}.message.show b{display:block}.controls{height:84px;display:flex;align-items:center;justify-content:center;gap:8px;border-top:1px solid var(--line);background:#07101a}.controls button{width:58px;height:48px;border:1px solid #32657a;border-radius:11px;background:#102335;color:var(--cy);font-size:20px;font-weight:900;cursor:pointer}.controls button:hover{filter:brightness(1.18)}.controls .restart{width:auto;padding:0 16px;color:var(--gold);border-color:#72582d;font-size:11px}@media(max-width:650px){.stage{padding:8px}.board{width:96vw;padding:5px;gap:2px}.hud{height:58px;padding:7px 10px}.stats span:nth-child(2){display:none}.controls{height:76px}.controls button{width:52px;height:45px}}
</style></head><body><header class="hud"><div><h1 id="name">Game Forge Preview</h1><small id="meta">Loading project…</small></div><div class="stats"><span id="mode">—</span><span id="position">0,0</span><span id="hearts">♥ ♥ ♥</span></div></header><main class="stage"><div class="board-wrap"><div class="board" id="board"></div><div class="message" id="message"><b id="messageText">GOAL REACHED</b></div></div></main><footer class="controls"><button aria-label="Move left" data-move="-1,0">←</button><button aria-label="Move up" data-move="0,-1">↑</button><button aria-label="Move down" data-move="0,1">↓</button><button aria-label="Move right" data-move="1,0">→</button><button class="restart" id="restart">Restart preview</button></footer><script>
(function(){'use strict';var STORE='axm.game-forge.projects.v1',id=new URLSearchParams(location.search).get('project'),state=null,x=0,y=0,hearts=3,done=false,$=function(i){return document.getElementById(i);};function load(){try{var box=JSON.parse(localStorage.getItem(STORE)||'null');state=box&&box.projects&&box.projects.find(function(p){return p.id===id;});}catch(e){}if(!state){$('meta').textContent='Project not found in this browser origin';return;}var spawn=state.world.cells.findIndex(function(c){return c.terrain==='spawn';});if(spawn<0)spawn=state.world.cells.findIndex(function(c){return c.terrain!=='wall'&&c.terrain!=='water';});if(spawn<0)spawn=0;x=spawn%16;y=Math.floor(spawn/16);hearts=3;done=false;$('name').textContent=state.name;$('meta').textContent='WASD / arrows / buttons · walls and water block movement';$('mode').textContent=state.runtimeMode+' PREVIEW';render();}function render(){if(!state)return;var b=$('board');b.className='board '+(state.runtimeMode==='3D'?'mode3d':'');b.innerHTML='';state.world.cells.forEach(function(c,i){var t=document.createElement('div');t.className='tile '+c.terrain;t.style.setProperty('--h',Number(c.height)||0);t.title=c.terrain+' · height '+(c.height||0);if(state.runtimeMode==='3D'&&c.height){var h=document.createElement('span');h.className='height';h.textContent=c.height;t.appendChild(h);}if(i===y*16+x){var p=document.createElement('div');p.className='player';p.setAttribute('aria-label','Player');t.appendChild(p);}b.appendChild(t);});$('position').textContent=x+','+y;$('hearts').textContent='♥ '.repeat(hearts).trim()||'OUT';}function move(dx,dy){if(!state||done||hearts<=0)return;var nx=Math.max(0,Math.min(15,x+dx)),ny=Math.max(0,Math.min(9,y+dy)),cell=state.world.cells[ny*16+nx];if(!cell||cell.terrain==='wall'||cell.terrain==='water')return;x=nx;y=ny;if(cell.terrain==='hazard'){hearts--;flash(hearts?'HAZARD · '+hearts+' HEARTS LEFT':'PREVIEW OVER');if(hearts<=0)done=true;}if(cell.terrain==='goal'){done=true;flash('GOAL REACHED');}render();}function flash(text){$('messageText').textContent=text;$('message').classList.add('show');setTimeout(function(){$('message').classList.remove('show');},1200);}document.querySelectorAll('[data-move]').forEach(function(b){b.onclick=function(){var p=this.dataset.move.split(',').map(Number);move(p[0],p[1]);};});window.addEventListener('keydown',function(e){var m={ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0],ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1]}[e.key];if(m){e.preventDefault();move(m[0],m[1]);}});$('restart').onclick=load;load();})();
</script></body></html>
