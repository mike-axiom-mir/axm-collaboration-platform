<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#10121c">
<link rel="icon" href="data:,">
<title>AXM Pocket Adventure Engine</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0d14;
  --panel: rgba(24, 27, 42, 0.88);
  --panel-strong: rgba(31, 35, 54, 0.98);
  --line: rgba(255, 255, 255, 0.12);
  --line-strong: rgba(255, 255, 255, 0.22);
  --text: #f6f3ff;
  --muted: #aaa8ba;
  --accent: #b89cff;
  --accent-2: #79e7da;
  --danger: #ff9b9b;
  --warning: #ffd98b;
  --ok: #8ff0bd;
  --shadow: 0 18px 50px rgba(0,0,0,.35);
  --radius: 18px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body {
  background:
    radial-gradient(circle at 20% -10%, rgba(184,156,255,.22), transparent 34%),
    radial-gradient(circle at 105% 10%, rgba(121,231,218,.14), transparent 30%),
    linear-gradient(180deg, #10121c 0%, #0b0d14 55%, #090a10 100%);
  overflow-x: hidden;
}
button, input, textarea, select { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid rgba(184,156,255,.5); outline-offset: 2px; }
.app { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  padding: calc(10px + var(--safe-top)) 12px 10px;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, rgba(11,13,20,.96), rgba(11,13,20,.78));
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
}
.brand { min-width: 0; flex: 1; }
.brand-kicker { color: var(--accent-2); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.brand-title { margin: 2px 0 0; font-size: 16px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: 8px; }
.action-btn, .secondary-btn, .danger-btn {
  min-height: 46px; border-radius: 14px; border: 1px solid var(--line-strong); padding: 10px 13px;
  color: var(--text); background: rgba(255,255,255,.06); font-weight: 800; letter-spacing: .01em;
}
.action-btn { background: linear-gradient(135deg, rgba(184,156,255,.27), rgba(121,231,218,.14)); border-color: rgba(184,156,255,.42); }
.action-btn:active, .secondary-btn:active, .danger-btn:active { transform: translateY(1px) scale(.995); }
.action-btn:disabled, .secondary-btn:disabled { opacity: .45; }
.action-btn.compact { font-size: 12px; padding-inline: 10px; }
.main { width: min(780px, 100%); margin: 0 auto; padding: 14px 12px calc(92px + var(--safe-bottom)); }
.view { display: none; }
.view.active { display: block; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
}
.empty {
  min-height: 62dvh; display: grid; place-items: center; padding: 28px 18px; text-align: center;
}
.empty-symbol { width: 86px; height: 86px; margin: 0 auto 18px; border-radius: 28px; display: grid; place-items: center; font-size: 36px;
  background: linear-gradient(135deg, rgba(184,156,255,.25), rgba(121,231,218,.12)); border: 1px solid rgba(184,156,255,.32); }
.empty h2 { margin: 0 0 10px; font-size: 25px; }
.empty p { color: var(--muted); line-height: 1.55; margin: 0 auto 20px; max-width: 480px; }
.empty-actions { display: grid; gap: 10px; width: min(360px, 100%); margin: 0 auto; }
.scene-card { overflow: hidden; }
.visual-shell { position: relative; width: 100%; aspect-ratio: 4 / 5; min-height: 280px; max-height: 65dvh; background: #151827; overflow: hidden; }
.visual-shell::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 -80px 80px -72px rgba(0,0,0,.9); z-index: 100; }
.visual-shell .visual-placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 30px;
  background: radial-gradient(circle at 30% 20%, rgba(184,156,255,.22), transparent 35%), linear-gradient(160deg, #1e2234, #10131e); }
.visual-layer { position: absolute; object-fit: contain; transform-origin: center; pointer-events: none; user-select: none; }
.visual-background { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; }
.scene-body { padding: 18px; }
.scene-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.scene-title { margin: 8px 0 10px; font-size: clamp(24px, 7vw, 34px); line-height: 1.08; }
.scene-mood { margin: 0 0 14px; color: var(--accent-2); font-style: italic; }
.scene-narration { color: #ece8f5; line-height: 1.65; font-size: 16px; white-space: pre-wrap; }
.scene-narration p { margin: 0 0 12px; }
.selected-tool { margin-top: 14px; display: none; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 12px; border-radius: 13px; background: rgba(121,231,218,.08); border: 1px solid rgba(121,231,218,.22); }
.selected-tool.visible { display: flex; }
.selected-tool strong { color: var(--accent-2); }
.text-btn { border: 0; background: transparent; color: var(--muted); min-height: 40px; padding: 6px 8px; font-weight: 800; }
.choices { display: grid; gap: 10px; margin-top: 15px; }
.choice-btn { width: 100%; min-height: 58px; padding: 13px 14px; border-radius: 15px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.055); color: var(--text); text-align: left; }
.choice-btn:not(:disabled):active { transform: scale(.994); }
.choice-label { display: block; font-weight: 850; font-size: 16px; }
.choice-hint { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.35; }
.choice-btn:disabled { opacity: .48; }
.section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; margin: 2px 2px 14px; }
.section-head h2 { margin: 0; font-size: 26px; }
.section-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.map-card { position: relative; overflow: hidden; min-height: 360px; }
.map-canvas { position: relative; width: 100%; aspect-ratio: 1 / 1; min-height: 340px; background: linear-gradient(145deg, #20243a, #111420); overflow: hidden; }
.map-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .92; }
.map-node { position: absolute; translate: -50% -50%; min-width: 42px; min-height: 42px; padding: 6px 9px; border-radius: 999px; border: 2px solid rgba(255,255,255,.72); background: rgba(17,20,32,.84); color: white; font-size: 11px; font-weight: 900; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
.map-node.current { background: var(--accent); color: #111; border-color: white; transform: scale(1.12); }
.map-node.locked { opacity: .35; }
.map-list { display: grid; gap: 9px; padding: 14px; }
.map-list-item, .item-card, .world-card, .pack-row { padding: 14px; border-radius: 15px; border: 1px solid var(--line); background: rgba(255,255,255,.04); }
.map-list-item strong, .item-card strong { display: block; }
.map-list-item span, .item-card p { color: var(--muted); font-size: 13px; line-height: 1.45; }
.item-grid { display: grid; gap: 10px; }
.item-card { width: 100%; text-align: left; color: var(--text); }
.item-card.selected { border-color: rgba(121,231,218,.62); background: rgba(121,231,218,.09); }
.item-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.item-count { min-width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: rgba(184,156,255,.18); font-weight: 900; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); font-size: 11px; }
.system-grid { display: grid; gap: 12px; }
.system-card { padding: 16px; }
.system-card h3 { margin: 0 0 6px; }
.system-card p { color: var(--muted); line-height: 1.5; margin: 0 0 12px; }
.form-label { display: block; font-size: 12px; color: var(--muted); font-weight: 800; margin: 12px 0 6px; }
.textarea, .select { width: 100%; border-radius: 13px; border: 1px solid var(--line-strong); background: rgba(0,0,0,.18); color: var(--text); padding: 12px; }
.textarea { min-height: 88px; resize: vertical; }
.button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.world-list, .pack-list { display: grid; gap: 8px; }
.world-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.world-card.active { border-color: rgba(184,156,255,.55); }
.world-title { font-weight: 900; }
.world-sub, .pack-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
.pack-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.pack-type { color: var(--accent-2); font-size: 11px; text-transform: uppercase; font-weight: 900; }
.danger-btn { border-color: rgba(255,155,155,.3); color: #ffd0d0; background: rgba(255,110,110,.06); }
.bottom-nav { position: fixed; z-index: 35; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(8px + var(--safe-bottom)); display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px;
  background: linear-gradient(0deg, rgba(11,13,20,.98), rgba(11,13,20,.86)); backdrop-filter: blur(20px); border-top: 1px solid var(--line); }
.nav-btn { min-height: 56px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 850; }
.nav-btn span { display: block; font-size: 19px; margin-bottom: 2px; }
.nav-btn.active { color: var(--text); background: rgba(184,156,255,.12); }
.nav-btn:disabled { opacity: .3; }
.modal-backdrop { position: fixed; z-index: 100; inset: 0; display: grid; align-items: end; background: rgba(0,0,0,.62); padding: 12px; }
.modal-backdrop[hidden] { display: none; }
.modal { width: min(720px, 100%); max-height: min(88dvh, 900px); margin: 0 auto; overflow: auto; border-radius: 22px 22px 18px 18px; background: var(--panel-strong); border: 1px solid var(--line-strong); box-shadow: 0 30px 90px rgba(0,0,0,.58); }
.modal-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 16px 12px; background: rgba(31,35,54,.97); border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 20px; }
.modal-close { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); color: var(--text); background: rgba(255,255,255,.05); font-size: 20px; }
.modal-body { padding: 16px; }
.modal-actions { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 16px calc(12px + var(--safe-bottom)); background: rgba(31,35,54,.97); border-top: 1px solid var(--line); }
.prompt-area { width: 100%; min-height: 52dvh; border-radius: 14px; border: 1px solid var(--line-strong); background: #0d0f18; color: #eeeaff; padding: 14px; line-height: 1.45; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; resize: vertical; }
.outcome-text { font-size: 17px; line-height: 1.65; white-space: pre-wrap; }
.notice { padding: 11px 12px; border-radius: 13px; background: rgba(255,217,139,.08); border: 1px solid rgba(255,217,139,.25); color: #ffe7b2; font-size: 13px; line-height: 1.45; }
.notice.ok { background: rgba(143,240,189,.08); border-color: rgba(143,240,189,.25); color: #bff9d9; }
.progress { height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 12px; }
.progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .18s ease; }
.toast { position: fixed; z-index: 150; left: 50%; bottom: calc(82px + var(--safe-bottom)); translate: -50% 14px; width: min(540px, calc(100% - 24px)); padding: 12px 14px; border-radius: 14px; color: var(--text); background: rgba(31,35,54,.97); border: 1px solid var(--line-strong); box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: .2s ease; }
.toast.show { opacity: 1; translate: -50% 0; }
.toast.error { border-color: rgba(255,155,155,.45); }
.small { font-size: 12px; color: var(--muted); }
code.inline { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; background: rgba(255,255,255,.06); padding: 2px 5px; border-radius: 6px; }
@media (min-width: 680px) {
  .topbar { padding-inline: 18px; }
  .main { padding-inline: 18px; }
  .modal-backdrop { align-items: center; }
  .modal { border-radius: 22px; }
  .visual-shell { aspect-ratio: 16 / 11; }
  .system-grid.two { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-kicker">Permanent shell · content stays outside</div>
      <div class="brand-title" id="brandTitle">AXM Pocket Adventure</div>
    </div>
    <div class="top-actions">
      <button class="action-btn compact" id="takeInBtn" type="button">TAKE IN</button>
      <button class="action-btn compact" id="promptBtn" type="button">FIRST PROMPT</button>
    </div>
  </header>

  <main class="main">
    <section class="view active" id="viewStory" aria-label="Story"></section>
    <section class="view" id="viewMap" aria-label="Map"></section>
    <section class="view" id="viewItems" aria-label="Items"></section>
    <section class="view" id="viewSystem" aria-label="System"></section>
  </main>

  <nav class="bottom-nav" aria-label="Adventure sections">
    <button class="nav-btn active" data-view="story" type="button"><span>✦</span>Story</button>
    <button class="nav-btn" data-view="map" type="button"><span>⌾</span>Map</button>
    <button class="nav-btn" data-view="items" type="button"><span>◇</span>Items</button>
    <button class="nav-btn" data-view="system" type="button"><span>⚙</span>System</button>
  </nav>
</div>

<input id="packInput" type="file" accept=".zip,application/zip" hidden>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-head">
      <h2 id="modalTitle">Dialog</h2>
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">×</button>
    </header>
    <div class="modal-body" id="modalBody"></div>
    <footer class="modal-actions" id="modalActions"></footer>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const ENGINE = Object.freeze({
  name: 'AXM Pocket Adventure Engine',
  version: '0.1.0',
  packSchema: 'axm.pocket-adventure.pack/1.0',
  handoffSchema: 'axm.pocket-adventure.handoff/1.0',
  database: 'axm-pocket-adventure-engine',
  databaseVersion: 1,
  maxPackBytes: 96 * 1024 * 1024,
  maxEntries: 1200,
  maxEntryBytes: 32 * 1024 * 1024,
  maxContentBytes: 4 * 1024 * 1024,
  maxLayersPerScene: 18,
  maxSceneText: 5000,
  maxEntityCount: 6000
});

const ALLOWED_BLEND_MODES = new Set(['normal','multiply','screen','overlay','soft-light','hard-light','darken','lighten']);
const ID_RE = /^[A-Za-z0-9][A-Za-z0-9._:-]{1,159}$/;
const SAFE_PATH_RE = /^(?!\/)(?!.*(?:^|\/)\.\.(?:\/|$))(?!.*\\)[^\0]+$/;
const ENTITY_DOMAINS = ['locations','items','hooks','scenes'];

const app = {
  db: null,
  world: null,
  worlds: [],
  packs: [],
  activeWorldId: null,
  view: 'story',
  selectedItemId: null,
  assetUrls: new Map(),
  renderToken: 0,
  busy: false,
  settings: { direction: '', profile: 'bedtime' }
};

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
const clone = value => globalThis.structuredClone ? structuredClone(value) : JSON.parse(JSON.stringify(value));
const clamp = (n, min, max) => Math.max(min, Math.min(max, Number(n)));
const text = value => value == null ? '' : String(value);
const sleepFrame = () => new Promise(resolve => requestAnimationFrame(() => resolve()));

function idbRequest(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('IndexedDB request failed.'));
  });
}

function txDone(tx) {
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted.'));
    tx.onerror = () => reject(tx.error || new Error('IndexedDB transaction failed.'));
  });
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(ENGINE.database, ENGINE.databaseVersion);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains('worlds')) db.createObjectStore('worlds', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('packs')) {
        const store = db.createObjectStore('packs', { keyPath: 'key' });
        store.createIndex('worldId', 'worldId', { unique: false });
      }
      if (!db.objectStoreNames.contains('assets')) {
        const store = db.createObjectStore('assets', { keyPath: 'key' });
        store.createIndex('worldId', 'worldId', { unique: false });
        store.createIndex('packId', 'packId', { unique: false });
      }
      if (!db.objectStoreNames.contains('snapshots')) {
        const store = db.createObjectStore('snapshots', { keyPath: 'id', autoIncrement: true });
        store.createIndex('worldId', 'worldId', { unique: false });
      }
      if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
      if (!db.objectStoreNames.contains('staging')) {
        const store = db.createObjectStore('staging', { keyPath: 'key' });
        store.createIndex('importId', 'importId', { unique: false });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('Could not open phone storage.'));
  });
}

async function dbGet(storeName, key) {
  const tx = app.db.transaction(storeName, 'readonly');
  const result = await idbRequest(tx.objectStore(storeName).get(key));
  await txDone(tx);
  return result;
}

async function dbGetAll(storeName) {
  const tx = app.db.transaction(storeName, 'readonly');
  const result = await idbRequest(tx.objectStore(storeName).getAll());
  await txDone(tx);
  return result;
}

async function dbGetAllByIndex(storeName, indexName, value) {
  const tx = app.db.transaction(storeName, 'readonly');
  const index = tx.objectStore(storeName).index(indexName);
  const result = await idbRequest(index.getAll(IDBKeyRange.only(value)));
  await txDone(tx);
  return result;
}

async function dbPut(storeName, value) {
  const tx = app.db.transaction(storeName, 'readwrite');
  await idbRequest(tx.objectStore(storeName).put(value));
  await txDone(tx);
}

async function dbDeleteMany(storeName, keys) {
  if (!keys.length) return;
  const tx = app.db.transaction(storeName, 'readwrite');
  const store = tx.objectStore(storeName);
  for (const key of keys) store.delete(key);
  await txDone(tx);
}

async function getSetting(key, fallback = null) {
  const record = await dbGet('settings', key);
  return record ? record.value : fallback;
}

async function setSetting(key, value) {
  await dbPut('settings', { key, value });
}

class ZipReader {
  constructor(file) {
    this.file = file;
    this.entries = new Map();
  }

  async init() {
    if (!(this.file instanceof Blob)) throw new Error('The selected item is not a readable file.');
    if (this.file.size > ENGINE.maxPackBytes) throw new Error(`Pack is too large. Hard limit: ${formatBytes(ENGINE.maxPackBytes)}.`);
    const tailLength = Math.min(this.file.size, 22 + 65535 + 20);
    const tailOffset = this.file.size - tailLength;
    const tail = new Uint8Array(await this.file.slice(tailOffset).arrayBuffer());
    let eocd = -1;
    for (let i = tail.length - 22; i >= 0; i--) {
      if (u32(tail, i) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('ZIP end record not found. The pack may be damaged or use unsupported ZIP64 packaging.');
    const totalEntries = u16(tail, eocd + 10);
    const cdSize = u32(tail, eocd + 12);
    const cdOffset = u32(tail, eocd + 16);
    if (totalEntries === 0xffff || cdSize === 0xffffffff || cdOffset === 0xffffffff) throw new Error('ZIP64 packs are not supported. Keep each pack below the phone-sized limits.');
    if (totalEntries > ENGINE.maxEntries) throw new Error(`Pack has ${totalEntries} entries; limit is ${ENGINE.maxEntries}. Split it into smaller patches.`);
    if (cdOffset + cdSize > this.file.size) throw new Error('ZIP directory points outside the file.');
    const cd = new Uint8Array(await this.file.slice(cdOffset, cdOffset + cdSize).arrayBuffer());
    const decoder = new TextDecoder('utf-8');
    let p = 0;
    for (let count = 0; count < totalEntries; count++) {
      if (u32(cd, p) !== 0x02014b50) throw new Error('Invalid ZIP central directory entry.');
      const flags = u16(cd, p + 8);
      const method = u16(cd, p + 10);
      const crc32 = u32(cd, p + 16);
      const compressedSize = u32(cd, p + 20);
      const uncompressedSize = u32(cd, p + 24);
      const nameLength = u16(cd, p + 28);
      const extraLength = u16(cd, p + 30);
      const commentLength = u16(cd, p + 32);
      const localOffset = u32(cd, p + 42);
      const nameStart = p + 46;
      const nameEnd = nameStart + nameLength;
      if (nameEnd > cd.length) throw new Error('Truncated ZIP filename.');
      const name = decoder.decode(cd.slice(nameStart, nameEnd));
      if (!SAFE_PATH_RE.test(name)) throw new Error(`Unsafe ZIP path rejected: ${name}`);
      if (flags & 0x0001) throw new Error(`Encrypted ZIP entries are not supported: ${name}`);
      if (![0,8].includes(method)) throw new Error(`Unsupported ZIP method ${method} in ${name}. Use STORE, or standard DEFLATE.`);
      if (uncompressedSize > ENGINE.maxEntryBytes) throw new Error(`${name} is too large after unpacking (${formatBytes(uncompressedSize)}).`);
      if (this.entries.has(name)) throw new Error(`Duplicate ZIP path: ${name}`);
      this.entries.set(name, { name, flags, method, crc32, compressedSize, uncompressedSize, localOffset, directory: name.endsWith('/') });
      p = nameEnd + extraLength + commentLength;
    }
    return this;
  }

  get(name) { return this.entries.get(name); }

  async readBytes(nameOrEntry) {
    const entry = typeof nameOrEntry === 'string' ? this.get(nameOrEntry) : nameOrEntry;
    if (!entry || entry.directory) throw new Error(`ZIP entry not found: ${typeof nameOrEntry === 'string' ? nameOrEntry : '(unknown)'}`);
    const header = new Uint8Array(await this.file.slice(entry.localOffset, entry.localOffset + 30).arrayBuffer());
    if (u32(header, 0) !== 0x04034b50) throw new Error(`Invalid local ZIP header for ${entry.name}.`);
    const nameLength = u16(header, 26);
    const extraLength = u16(header, 28);
    const dataStart = entry.localOffset + 30 + nameLength + extraLength;
    const compressed = new Uint8Array(await this.file.slice(dataStart, dataStart + entry.compressedSize).arrayBuffer());
    if (entry.method === 0) {
      if (compressed.byteLength !== entry.uncompressedSize) throw new Error(`Stored entry size mismatch: ${entry.name}`);
      return compressed;
    }
    if (!('DecompressionStream' in globalThis)) throw new Error(`This browser cannot open DEFLATE ZIPs. Ask the pack generator to create a ZIP_STORED pack.`);
    let stream;
    try { stream = new DecompressionStream('deflate-raw'); }
    catch { throw new Error(`This browser lacks raw DEFLATE support. Ask the pack generator to create a ZIP_STORED pack.`); }
    const output = new Uint8Array(await new Response(new Blob([compressed]).stream().pipeThrough(stream)).arrayBuffer());
    if (output.byteLength !== entry.uncompressedSize) throw new Error(`Unpacked size mismatch: ${entry.name}`);
    return output;
  }

  async readText(name) {
    const bytes = await this.readBytes(name);
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  }
}

function u16(bytes, offset) { return bytes[offset] | (bytes[offset+1] << 8); }
function u32(bytes, offset) { return (bytes[offset] | (bytes[offset+1] << 8) | (bytes[offset+2] << 16) | (bytes[offset+3] << 24)) >>> 0; }

function formatBytes(bytes) {
  const units = ['B','KB','MB','GB'];
  let n = Number(bytes) || 0;
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${n >= 10 || i === 0 ? n.toFixed(0) : n.toFixed(1)} ${units[i]}`;
}

function semverParts(value) {
  const match = String(value || '').match(/^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/);
  if (!match) throw new Error(`Invalid semantic version: ${value}`);
  return match.slice(1).map(Number);
}

function compareSemver(a, b) {
  const aa = semverParts(a), bb = semverParts(b);
  for (let i = 0; i < 3; i++) if (aa[i] !== bb[i]) return aa[i] < bb[i] ? -1 : 1;
  return 0;
}

function maxVersionAllows(current, maximum) {
  const wildcard = String(maximum || '').match(/^(\d+)\.(\d+)\.[xX*]$/);
  if (wildcard) {
    const [major, minor] = semverParts(current);
    return major < Number(wildcard[1]) || (major === Number(wildcard[1]) && minor <= Number(wildcard[2]));
  }
  return compareSemver(current, maximum) <= 0;
}

function canonicalize(value) {
  if (Array.isArray(value)) return value.map(canonicalize);
  if (value && typeof value === 'object') {
    const out = {};
    for (const key of Object.keys(value).sort()) out[key] = canonicalize(value[key]);
    return out;
  }
  return value;
}

function canonicalString(value) { return JSON.stringify(canonicalize(value)); }

function fnv1a64(value) {
  const bytes = new TextEncoder().encode(String(value));
  let hash = 0xcbf29ce484222325n;
  const prime = 0x100000001b3n;
  const mask = 0xffffffffffffffffn;
  for (const byte of bytes) { hash ^= BigInt(byte); hash = (hash * prime) & mask; }
  return hash.toString(16).padStart(16, '0');
}

async function sha256Hex(bytes) {
  if (!globalThis.crypto?.subtle) return null;
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(digest)].map(v => v.toString(16).padStart(2,'0')).join('');
}

function safeId(value, label) {
  if (!ID_RE.test(String(value || ''))) throw new Error(`${label} has an invalid ID: ${value}`);
  return String(value);
}

function safePath(value, label) {
  const path = String(value || '');
  if (!SAFE_PATH_RE.test(path)) throw new Error(`${label} has an unsafe path: ${path}`);
  return path;
}

function limitedText(value, max, label) {
  const out = text(value);
  if (out.length > max) throw new Error(`${label} exceeds ${max} characters.`);
  return out;
}

function assertObject(value, label) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error(`${label} must be an object.`);
  return value;
}

function arrayOf(value) { return Array.isArray(value) ? value : []; }

function validateManifest(manifest, zip) {
  assertObject(manifest, 'manifest.json');
  if (manifest.schema !== ENGINE.packSchema) throw new Error(`Pack schema ${manifest.schema || '(missing)'} is not compatible with ${ENGINE.packSchema}.`);
  safeId(manifest.packId, 'packId');
  safeId(manifest.worldId, 'worldId');
  semverParts(manifest.packVersion);
  if (!['world','expansion','patch'].includes(manifest.type)) throw new Error('Pack type must be world, expansion, or patch.');
  const min = manifest.engine?.min || '0.1.0';
  if (compareSemver(ENGINE.version, min) < 0) throw new Error(`This pack requires engine ${min} or newer.`);
  if (manifest.engine?.max && !maxVersionAllows(ENGINE.version, manifest.engine.max)) throw new Error(`This pack supports engine versions only through ${manifest.engine.max}.`);
  if (!manifest.content?.path) throw new Error('manifest.content.path is required.');
  safePath(manifest.content.path, 'content.path');
  if (!zip.get(manifest.content.path)) throw new Error(`Content file is missing: ${manifest.content.path}`);
  const assets = arrayOf(manifest.assets);
  if (assets.length > 1000) throw new Error('Pack contains too many assets. Split it into smaller patches.');
  const assetIds = new Set();
  for (const asset of assets) {
    assertObject(asset, 'asset');
    safeId(asset.id, 'asset.id');
    safePath(asset.path, `asset ${asset.id}`);
    if (assetIds.has(asset.id)) throw new Error(`Duplicate asset ID: ${asset.id}`);
    assetIds.add(asset.id);
    const entry = zip.get(asset.path);
    if (!entry) throw new Error(`Asset file is missing: ${asset.path}`);
    if (entry.uncompressedSize > ENGINE.maxEntryBytes) throw new Error(`Asset is too large: ${asset.path}`);
    if (!/^[-\w.+]+\/[-\w.+]+$/.test(String(asset.mediaType || ''))) throw new Error(`Asset ${asset.id} needs a valid mediaType.`);
  }
  for (const dependency of arrayOf(manifest.dependencies)) {
    assertObject(dependency, 'dependency');
    safeId(dependency.packId, 'dependency.packId');
    if (dependency.minVersion) semverParts(dependency.minVersion);
  }
  if (manifest.type !== 'world') {
    if (!manifest.builtFromStateHash) throw new Error('Expansion and patch packs must include builtFromStateHash from the deterministic prompt.');
    if (!Number.isInteger(manifest.generation?.sequence) || manifest.generation.sequence < 1) throw new Error('Expansion and patch packs need generation.sequence.');
  }
  return manifest;
}

function validateContentShape(content, manifest) {
  assertObject(content, 'content JSON');
  if (manifest.type === 'world') {
    const world = assertObject(content.world, 'content.world');
    if (world.id !== manifest.worldId) throw new Error('content.world.id must match manifest.worldId.');
    safeId(world.id, 'world.id');
    safeId(world.startSceneId, 'world.startSceneId');
    limitedText(world.title, 160, 'world.title');
    limitedText(world.summary, 1200, 'world.summary');
  }
  const additions = content.additions || {};
  for (const domain of ENTITY_DOMAINS) {
    if (additions[domain] != null && !Array.isArray(additions[domain])) throw new Error(`additions.${domain} must be an array.`);
  }
  if (content.operations != null && !Array.isArray(content.operations)) throw new Error('operations must be an array.');
  if (arrayOf(content.operations).length > 500) throw new Error('Too many patch operations in one pack.');
  const total = ENTITY_DOMAINS.reduce((sum, d) => sum + arrayOf(additions[d]).length, 0);
  if (total > 1000) throw new Error('Pack adds too many entities. Split it into smaller patches.');
}

function defaultWorldState() {
  return {
    flags: {},
    counters: {},
    inventory: {},
    visitedScenes: {},
    sceneStates: {},
    locationStates: {},
    hooks: {},
    turn: 0,
    day: 1,
    history: []
  };
}

function normalizeWorld(manifest, worldInput) {
  const continuity = normalizeContinuity(worldInput.continuity || {});
  return {
    schema: 'axm.pocket-adventure.world/1.0',
    id: manifest.worldId,
    title: limitedText(worldInput.title || manifest.title || manifest.worldId, 160, 'world.title'),
    summary: limitedText(worldInput.summary || '', 1200, 'world.summary'),
    tone: limitedText(worldInput.tone || 'Curious, grounded, and surprising.', 400, 'world.tone'),
    startSceneId: safeId(worldInput.startSceneId, 'world.startSceneId'),
    currentSceneId: safeId(worldInput.startSceneId, 'world.startSceneId'),
    currentLocationId: worldInput.startLocationId ? safeId(worldInput.startLocationId, 'world.startLocationId') : null,
    mapAssetId: worldInput.mapAssetId ? safeId(worldInput.mapAssetId, 'world.mapAssetId') : null,
    defaultNoEffectText: limitedText(worldInput.defaultNoEffectText || 'It is a curious thought, but nothing clearly changes yet.', 400, 'world.defaultNoEffectText'),
    generationRules: arrayOf(worldInput.generationRules).map(v => limitedText(v, 500, 'generation rule')).slice(0, 30),
    continuity,
    entities: { locations: {}, items: {}, hooks: {}, scenes: {} },
    assets: {},
    state: defaultWorldState(),
    installedPacks: [],
    nextPackSequence: 1,
    contentRevision: 0,
    stateRevision: 0,
    lastImport: null
  };
}

function normalizeContinuity(input) {
  return {
    worldBible: limitedText(input.worldBible || '', 5000, 'continuity.worldBible'),
    currentArc: limitedText(input.currentArc || '', 1200, 'continuity.currentArc'),
    recap: limitedText(input.recap || '', 2600, 'continuity.recap'),
    openQuestions: arrayOf(input.openQuestions).map(v => limitedText(v, 400, 'continuity.openQuestions')).slice(0, 30),
    recentSummaries: arrayOf(input.recentSummaries).map(v => limitedText(v, 600, 'continuity.recentSummaries')).slice(-16)
  };
}

function normalizeEntity(domain, raw) {
  assertObject(raw, `${domain} entity`);
  const entity = clone(raw);
  entity.id = safeId(entity.id, `${domain}.id`);
  entity.revision = Number.isInteger(entity.revision) && entity.revision > 0 ? entity.revision : 1;
  if (domain === 'locations') {
    entity.name = limitedText(entity.name || entity.id, 140, 'location.name');
    entity.description = limitedText(entity.description || '', 900, 'location.description');
    entity.x = clamp(entity.x ?? 50, 0, 100);
    entity.y = clamp(entity.y ?? 50, 0, 100);
    entity.tags = normalizeTags(entity.tags);
    entity.neighbors = arrayOf(entity.neighbors).map(v => safeId(v, `neighbors of ${entity.id}`));
  }
  if (domain === 'items') {
    entity.name = limitedText(entity.name || entity.id, 140, 'item.name');
    entity.description = limitedText(entity.description || '', 1200, 'item.description');
    entity.curiosity = limitedText(entity.curiosity || '', 800, 'item.curiosity');
    entity.tags = normalizeTags(entity.tags);
    entity.stackable = entity.stackable !== false;
  }
  if (domain === 'hooks') {
    entity.summary = limitedText(entity.summary || entity.id, 700, 'hook.summary');
    entity.tags = normalizeTags(entity.tags);
    if (entity.startLocationId) safeId(entity.startLocationId, 'hook.startLocationId');
    if (entity.movement) {
      const movement = assertObject(entity.movement, 'hook.movement');
      if (!['stationary','wander'].includes(movement.mode || 'stationary')) throw new Error(`Unsupported movement mode for hook ${entity.id}.`);
      movement.everyTurns = Math.max(1, Math.floor(Number(movement.everyTurns || 2)));
      movement.allowedLocationTags = normalizeTags(movement.allowedLocationTags);
    }
  }
  if (domain === 'scenes') {
    entity.title = limitedText(entity.title || entity.id, 180, 'scene.title');
    entity.mood = limitedText(entity.mood || '', 500, 'scene.mood');
    entity.narration = normalizeNarration(entity.narration);
    entity.tags = normalizeTags(entity.tags);
    entity.locationId = safeId(entity.locationId, 'scene.locationId');
    entity.choices = arrayOf(entity.choices).map(choice => normalizeChoice(choice, entity.id));
    if (entity.choices.length > 8) throw new Error(`Scene ${entity.id} has too many choices.`);
    const ids = new Set();
    for (const choice of entity.choices) {
      if (ids.has(choice.id)) throw new Error(`Duplicate choice ${choice.id} in scene ${entity.id}.`);
      ids.add(choice.id);
    }
    entity.visual = normalizeVisual(entity.visual || (entity.imageAssetId ? { backgroundAssetId: entity.imageAssetId } : {}));
    entity.onEnter = arrayOf(entity.onEnter).map(normalizeEffect);
  }
  return entity;
}

function normalizeTags(value) {
  return [...new Set(arrayOf(value).map(v => limitedText(v, 64, 'tag').trim().toLowerCase()).filter(Boolean))].slice(0, 32);
}

function normalizeNarration(value) {
  const paragraphs = Array.isArray(value) ? value : [value || ''];
  const clean = paragraphs.map(v => limitedText(v, ENGINE.maxSceneText, 'scene narration')).filter(Boolean);
  if (clean.join('\n').length > ENGINE.maxSceneText) throw new Error(`Scene narration exceeds ${ENGINE.maxSceneText} characters.`);
  return clean;
}

function normalizeVisual(value) {
  const visual = value && typeof value === 'object' ? clone(value) : {};
  if (visual.backgroundAssetId) safeId(visual.backgroundAssetId, 'visual.backgroundAssetId');
  visual.fit = ['cover','contain'].includes(visual.fit) ? visual.fit : 'cover';
  visual.aspect = limitedText(visual.aspect || '4/5', 20, 'visual.aspect');
  visual.layers = arrayOf(visual.layers).slice(0, ENGINE.maxLayersPerScene).map((layer, index) => {
    assertObject(layer, 'visual layer');
    return {
      assetId: safeId(layer.assetId, 'layer.assetId'),
      x: clamp(layer.x ?? 50, -50, 150),
      y: clamp(layer.y ?? 50, -50, 150),
      width: clamp(layer.width ?? 100, 1, 250),
      height: clamp(layer.height ?? 100, 1, 250),
      rotation: clamp(layer.rotation ?? 0, -1080, 1080),
      opacity: clamp(layer.opacity ?? 1, 0, 1),
      z: Number.isFinite(Number(layer.z)) ? Number(layer.z) : index + 1,
      blendMode: ALLOWED_BLEND_MODES.has(layer.blendMode) ? layer.blendMode : 'normal',
      fit: ['cover','contain','fill'].includes(layer.fit) ? layer.fit : 'contain'
    };
  });
  return visual;
}

function normalizeChoice(raw, sceneId) {
  assertObject(raw, `choice in ${sceneId}`);
  const choice = clone(raw);
  choice.id = safeId(choice.id, 'choice.id');
  choice.label = limitedText(choice.label || choice.id, 220, 'choice.label');
  choice.hint = limitedText(choice.hint || '', 500, 'choice.hint');
  choice.lockedText = limitedText(choice.lockedText || '', 300, 'choice.lockedText');
  if (choice.to) safeId(choice.to, 'choice.to');
  choice.active = choice.active !== false;
  choice.effects = arrayOf(choice.effects).map(normalizeEffect);
  choice.itemResponses = arrayOf(choice.itemResponses).map(response => normalizeItemResponse(response, choice.id));
  choice.resultText = limitedText(choice.resultText || '', 2200, 'choice.resultText');
  if (choice.onUnchosen?.hookId) safeId(choice.onUnchosen.hookId, 'choice.onUnchosen.hookId');
  return choice;
}

function normalizeItemResponse(raw, choiceId) {
  assertObject(raw, `item response in ${choiceId}`);
  const response = clone(raw);
  response.id = safeId(response.id, 'itemResponse.id');
  response.match = response.match || {};
  response.match.itemIds = arrayOf(response.match.itemIds).map(v => safeId(v, 'itemResponse.match.itemIds'));
  response.match.anyTags = normalizeTags(response.match.anyTags);
  response.match.allTags = normalizeTags(response.match.allTags);
  response.resultText = limitedText(response.resultText || '', 2200, 'itemResponse.resultText');
  response.effects = arrayOf(response.effects).map(normalizeEffect);
  response.mode = ['replace','augment'].includes(response.mode) ? response.mode : 'replace';
  response.completesChoice = response.completesChoice !== false;
  response.advanceTurns = Math.max(0, Math.floor(Number(response.advanceTurns ?? (response.completesChoice ? 1 : 0))));
  response.consume = Math.max(0, Math.floor(Number(response.consume || 0)));
  response.priority = Number.isFinite(Number(response.priority)) ? Number(response.priority) : 0;
  if (response.to) safeId(response.to, 'itemResponse.to');
  return response;
}

function normalizeEffect(raw) {
  assertObject(raw, 'effect');
  const effect = clone(raw);
  const allowed = new Set(['setFlag','increment','giveItem','takeItem','activateHook','resolveHook','setSceneState','setLocationState','advanceTime']);
  if (!allowed.has(effect.type)) throw new Error(`Unsupported effect type: ${effect.type}`);
  if (effect.itemId) safeId(effect.itemId, 'effect.itemId');
  if (effect.hookId) safeId(effect.hookId, 'effect.hookId');
  if (effect.sceneId) safeId(effect.sceneId, 'effect.sceneId');
  if (effect.locationId) safeId(effect.locationId, 'effect.locationId');
  if (effect.key) limitedText(effect.key, 120, 'effect.key');
  return effect;
}

function addManifestAssets(world, manifest) {
  for (const asset of arrayOf(manifest.assets)) {
    if (world.assets[asset.id]) throw new Error(`Asset ID already exists: ${asset.id}`);
    world.assets[asset.id] = {
      id: asset.id,
      path: asset.path,
      mediaType: asset.mediaType,
      role: limitedText(asset.role || 'asset', 80, 'asset.role'),
      sha256: asset.sha256 || null,
      packId: manifest.packId
    };
  }
}

function applyAdditions(world, additions = {}) {
  for (const domain of ENTITY_DOMAINS) {
    const target = world.entities[domain];
    for (const raw of arrayOf(additions[domain])) {
      const entity = normalizeEntity(domain, raw);
      if (target[entity.id]) throw new Error(`${domain} ID already exists: ${entity.id}`);
      target[entity.id] = entity;
    }
  }
}

function deepMerge(target, changes) {
  if (!changes || typeof changes !== 'object' || Array.isArray(changes)) return clone(changes);
  const out = target && typeof target === 'object' && !Array.isArray(target) ? clone(target) : {};
  for (const [key, value] of Object.entries(changes)) {
    if (['__proto__','constructor','prototype','id','revision'].includes(key)) continue;
    out[key] = value && typeof value === 'object' && !Array.isArray(value) ? deepMerge(out[key], value) : clone(value);
  }
  return out;
}

function requireRevision(entity, expected, label) {
  if (!Number.isInteger(expected)) throw new Error(`${label} needs expectedRevision.`);
  if (entity.revision !== expected) throw new Error(`${label} expected revision ${expected}, found ${entity.revision}. Generate a fresh prompt.`);
}

function applyOperations(world, operations = []) {
  for (const raw of arrayOf(operations)) {
    const op = assertObject(raw, 'patch operation');
    if (op.op === 'addChoice') {
      const scene = world.entities.scenes[safeId(op.sceneId, 'addChoice.sceneId')];
      if (!scene) throw new Error(`addChoice scene not found: ${op.sceneId}`);
      requireRevision(scene, op.expectedRevision, `addChoice ${op.sceneId}`);
      const choice = normalizeChoice(op.choice, scene.id);
      if (scene.choices.some(v => v.id === choice.id)) throw new Error(`Choice already exists: ${choice.id}`);
      scene.choices.push(choice); scene.revision++;
      continue;
    }
    if (op.op === 'addItemResponse') {
      const scene = world.entities.scenes[safeId(op.sceneId, 'addItemResponse.sceneId')];
      if (!scene) throw new Error(`addItemResponse scene not found: ${op.sceneId}`);
      requireRevision(scene, op.expectedRevision, `addItemResponse ${op.sceneId}`);
      const choice = scene.choices.find(v => v.id === op.choiceId);
      if (!choice) throw new Error(`Choice not found: ${op.choiceId}`);
      const response = normalizeItemResponse(op.response, choice.id);
      if (choice.itemResponses.some(v => v.id === response.id)) throw new Error(`Item response already exists: ${response.id}`);
      choice.itemResponses.push(response); scene.revision++;
      continue;
    }
    if (op.op === 'mergeEntity') {
      if (!ENTITY_DOMAINS.includes(op.domain)) throw new Error(`mergeEntity has unknown domain: ${op.domain}`);
      const entity = world.entities[op.domain][safeId(op.id, 'mergeEntity.id')];
      if (!entity) throw new Error(`mergeEntity target not found: ${op.domain}/${op.id}`);
      requireRevision(entity, op.expectedRevision, `mergeEntity ${op.id}`);
      const merged = deepMerge(entity, assertObject(op.changes, 'mergeEntity.changes'));
      merged.id = entity.id;
      merged.revision = entity.revision + 1;
      world.entities[op.domain][entity.id] = normalizeEntity(op.domain, merged);
      continue;
    }
    if (op.op === 'deactivateChoice') {
      const scene = world.entities.scenes[safeId(op.sceneId, 'deactivateChoice.sceneId')];
      if (!scene) throw new Error(`deactivateChoice scene not found: ${op.sceneId}`);
      requireRevision(scene, op.expectedRevision, `deactivateChoice ${op.sceneId}`);
      const choice = scene.choices.find(v => v.id === op.choiceId);
      if (!choice) throw new Error(`Choice not found: ${op.choiceId}`);
      choice.active = false;
      choice.deactivationReason = limitedText(op.reason || 'Explicitly retired by patch.', 500, 'deactivation reason');
      scene.revision++;
      continue;
    }
    throw new Error(`Unsupported patch operation: ${op.op}`);
  }
}

function applyWorldPatch(world, patch) {
  if (!patch) return;
  assertObject(patch, 'worldPatch');
  if (patch.title != null) world.title = limitedText(patch.title, 160, 'worldPatch.title');
  if (patch.summary != null) world.summary = limitedText(patch.summary, 1200, 'worldPatch.summary');
  if (patch.tone != null) world.tone = limitedText(patch.tone, 400, 'worldPatch.tone');
  if (patch.mapAssetId != null) world.mapAssetId = patch.mapAssetId ? safeId(patch.mapAssetId, 'worldPatch.mapAssetId') : null;
  if (patch.generationRules != null) world.generationRules = arrayOf(patch.generationRules).map(v => limitedText(v, 500, 'generation rule')).slice(0, 30);
  if (patch.continuity != null) world.continuity = normalizeContinuity(deepMerge(world.continuity, patch.continuity));
}

function validateWorldReferences(world) {
  const counts = ENTITY_DOMAINS.reduce((sum, d) => sum + Object.keys(world.entities[d]).length, 0);
  if (counts > ENGINE.maxEntityCount) throw new Error(`World exceeds ${ENGINE.maxEntityCount} structured entities. Split or archive before adding more.`);
  if (!world.entities.scenes[world.startSceneId]) throw new Error(`Start scene does not exist: ${world.startSceneId}`);
  if (!world.entities.scenes[world.currentSceneId]) throw new Error(`Current scene does not exist: ${world.currentSceneId}`);
  if (world.mapAssetId && !world.assets[world.mapAssetId]) throw new Error(`Map asset does not exist: ${world.mapAssetId}`);
  for (const location of Object.values(world.entities.locations)) {
    for (const neighbor of location.neighbors || []) if (!world.entities.locations[neighbor]) throw new Error(`Location ${location.id} points to missing neighbor ${neighbor}.`);
  }
  for (const hook of Object.values(world.entities.hooks)) if (hook.startLocationId && !world.entities.locations[hook.startLocationId]) throw new Error(`Hook ${hook.id} starts at missing location ${hook.startLocationId}.`);
  for (const scene of Object.values(world.entities.scenes)) {
    if (!world.entities.locations[scene.locationId]) throw new Error(`Scene ${scene.id} uses missing location ${scene.locationId}.`);
    const assetRefs = [];
    if (scene.visual?.backgroundAssetId) assetRefs.push(scene.visual.backgroundAssetId);
    for (const layer of scene.visual?.layers || []) assetRefs.push(layer.assetId);
    for (const assetId of assetRefs) if (!world.assets[assetId]) throw new Error(`Scene ${scene.id} uses missing asset ${assetId}.`);
    for (const choice of scene.choices) {
      if (choice.to && !world.entities.scenes[choice.to]) throw new Error(`Choice ${choice.id} points to missing scene ${choice.to}.`);
      if (choice.onUnchosen?.hookId && !world.entities.hooks[choice.onUnchosen.hookId]) throw new Error(`Choice ${choice.id} references missing hook ${choice.onUnchosen.hookId}.`);
      for (const response of choice.itemResponses) if (response.to && !world.entities.scenes[response.to]) throw new Error(`Item response ${response.id} points to missing scene ${response.to}.`);
    }
  }
  const currentScene = world.entities.scenes[world.currentSceneId];
  if (!world.currentLocationId) world.currentLocationId = currentScene.locationId;
  if (!world.entities.locations[world.currentLocationId]) throw new Error(`Current location does not exist: ${world.currentLocationId}`);
}

async function getInstalledPacks(worldId) {
  return (await dbGetAllByIndex('packs', 'worldId', worldId)).sort((a,b) => a.installOrder - b.installOrder);
}

async function planInstall(manifest, content) {
  const existing = await dbGet('worlds', manifest.worldId);
  const packs = existing ? await getInstalledPacks(manifest.worldId) : [];
  if (packs.some(p => p.packId === manifest.packId)) throw new Error(`Pack already installed: ${manifest.packId}`);
  if (manifest.type === 'world' && existing) throw new Error(`World ${manifest.worldId} already exists. Base packs never overwrite a world.`);
  if (manifest.type !== 'world' && !existing) throw new Error(`Target world is not installed: ${manifest.worldId}`);
  for (const dependency of arrayOf(manifest.dependencies)) {
    const installed = packs.find(p => p.packId === dependency.packId);
    if (!installed) throw new Error(`Missing dependency: ${dependency.packId}`);
    if (dependency.minVersion && compareSemver(installed.packVersion, dependency.minVersion) < 0) throw new Error(`Dependency ${dependency.packId} must be ${dependency.minVersion} or newer.`);
  }
  if (existing && manifest.type !== 'world') {
    const snapshot = createHandoffSnapshot(existing, packs);
    const currentHash = fnv1a64(canonicalString(snapshot));
    if (manifest.builtFromStateHash !== currentHash) throw new Error(`This pack was built from state ${manifest.builtFromStateHash}, but the phone is now at ${currentHash}. Generate a fresh prompt; nothing was changed.`);
    if (manifest.generation.sequence !== existing.nextPackSequence) throw new Error(`Pack sequence ${manifest.generation.sequence} does not match expected ${existing.nextPackSequence}.`);
  }
  const next = manifest.type === 'world' ? normalizeWorld(manifest, content.world) : clone(existing);
  const previousWorld = existing ? clone(existing) : null;
  addManifestAssets(next, manifest);
  applyAdditions(next, content.additions || {});
  applyOperations(next, content.operations || []);
  applyWorldPatch(next, content.worldPatch || null);
  const installOrder = packs.length + 1;
  next.installedPacks.push({ packId: manifest.packId, packVersion: manifest.packVersion, type: manifest.type, installOrder });
  next.contentRevision += 1;
  next.lastImport = { packId: manifest.packId, contentRevision: next.contentRevision, stateRevision: next.stateRevision };
  if (manifest.type !== 'world') next.nextPackSequence = manifest.generation.sequence + 1;
  validateWorldReferences(next);
  if (manifest.type === 'world') {
    const scene = next.entities.scenes[next.startSceneId];
    next.currentSceneId = next.startSceneId;
    next.currentLocationId = scene.locationId;
    next.state.visitedScenes[next.startSceneId] = 1;
    applyEffects(next, scene.onEnter || []);
  }
  return { previousWorld, nextWorld: next, packs, installOrder };
}

async function importPack(file) {
  if (app.busy) return;
  app.busy = true;
  let importId = null;
  try {
    openProgress('Reading cartridge', `Checking ${file.name || 'selected ZIP'} without loading the whole pack into memory.`);
    const zip = await new ZipReader(file).init();
    updateProgress(5, `Found ${zip.entries.size} ZIP entries.`);
    const manifestEntry = zip.get('manifest.json');
    if (!manifestEntry) throw new Error('Compatible packs need manifest.json at the ZIP root.');
    if (manifestEntry.uncompressedSize > 512 * 1024) throw new Error('manifest.json is unexpectedly large.');
    const manifest = validateManifest(JSON.parse(await zip.readText('manifest.json')), zip);
    updateProgress(12, `Checking ${manifest.packId} ${manifest.packVersion}.`);
    const contentEntry = zip.get(manifest.content.path);
    if (contentEntry.uncompressedSize > ENGINE.maxContentBytes) throw new Error(`Content JSON exceeds ${formatBytes(ENGINE.maxContentBytes)}.`);
    const contentBytes = await zip.readBytes(contentEntry);
    if (manifest.content.sha256) {
      const hash = await sha256Hex(contentBytes);
      if (hash && hash !== String(manifest.content.sha256).toLowerCase()) throw new Error('Content hash mismatch. The pack may be incomplete or altered.');
    }
    const content = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(contentBytes));
    validateContentShape(content, manifest);
    const plan = await planInstall(manifest, content);
    importId = `${manifest.packId}::${Date.now()}::${Math.random().toString(36).slice(2)}`;
    const assets = arrayOf(manifest.assets);
    let done = 0;
    for (const asset of assets) {
      updateProgress(15 + Math.round((done / Math.max(1, assets.length)) * 68), `Taking in ${done + 1}/${assets.length}: ${asset.role || asset.id}`);
      const bytes = await zip.readBytes(asset.path);
      if (asset.sha256) {
        const hash = await sha256Hex(bytes);
        if (hash && hash !== String(asset.sha256).toLowerCase()) throw new Error(`Asset hash mismatch: ${asset.id}`);
      }
      await dbPut('staging', {
        key: `${importId}::${asset.id}`,
        importId,
        worldId: manifest.worldId,
        packId: manifest.packId,
        assetId: asset.id,
        mediaType: asset.mediaType,
        role: asset.role || 'asset',
        sha256: asset.sha256 || null,
        blob: new Blob([bytes], { type: asset.mediaType })
      });
      done++;
      await sleepFrame();
    }
    updateProgress(86, 'Validating links, choices, items, and patch revisions.');
    await commitInstall(manifest, file, plan, importId);
    importId = null;
    updateProgress(100, `${manifest.title || manifest.packId} is ready.`);
    await loadAllState(manifest.worldId);
    setTimeout(closeModal, 450);
    toast(`${manifest.type === 'world' ? 'World' : 'Patch'} taken in: ${manifest.title || manifest.packId}`);
  } catch (error) {
    if (importId) await cleanupStaging(importId).catch(() => {});
    closeModal();
    showError('Take In stopped safely', error);
  } finally {
    app.busy = false;
    $('#packInput').value = '';
  }
}

async function commitInstall(manifest, file, plan, importId) {
  const staged = await dbGetAllByIndex('staging', 'importId', importId);
  if (staged.length !== arrayOf(manifest.assets).length) throw new Error('Staged asset count does not match manifest.');
  const world = plan.nextWorld;
  const packKey = `${manifest.worldId}::${manifest.packId}`;
  const assetKeys = staged.map(s => `${manifest.worldId}::${s.assetId}`);
  const tx = app.db.transaction(['worlds','packs','assets','snapshots','staging','settings'], 'readwrite');
  const worlds = tx.objectStore('worlds');
  const packs = tx.objectStore('packs');
  const assets = tx.objectStore('assets');
  const snapshots = tx.objectStore('snapshots');
  const staging = tx.objectStore('staging');
  const settings = tx.objectStore('settings');
  for (const record of staged) {
    assets.put({
      key: `${manifest.worldId}::${record.assetId}`,
      worldId: manifest.worldId,
      packId: manifest.packId,
      assetId: record.assetId,
      mediaType: record.mediaType,
      role: record.role,
      sha256: record.sha256,
      blob: record.blob
    });
    staging.delete(record.key);
  }
  worlds.put(world);
  packs.put({
    key: packKey,
    worldId: manifest.worldId,
    packId: manifest.packId,
    packVersion: manifest.packVersion,
    type: manifest.type,
    title: limitedText(manifest.title || manifest.packId, 180, 'manifest.title'),
    installOrder: plan.installOrder,
    builtFromStateHash: manifest.builtFromStateHash || null,
    sequence: manifest.generation?.sequence || 0,
    sourceSize: file.size,
    assetKeys,
    manifest: clone(manifest)
  });
  snapshots.add({
    worldId: manifest.worldId,
    packKey,
    packId: manifest.packId,
    assetKeys,
    worldBefore: plan.previousWorld,
    contentRevisionAfter: world.contentRevision,
    stateRevisionAfter: world.stateRevision,
    installOrder: plan.installOrder
  });
  settings.put({ key: 'activeWorldId', value: manifest.worldId });
  await txDone(tx);
}

async function cleanupStaging(importId) {
  const records = await dbGetAllByIndex('staging', 'importId', importId);
  await dbDeleteMany('staging', records.map(r => r.key));
}

async function loadAllState(preferredWorldId = null) {
  clearAssetUrls();
  app.worlds = (await dbGetAll('worlds')).sort((a,b) => a.title.localeCompare(b.title));
  const storedActive = preferredWorldId || await getSetting('activeWorldId', null);
  app.activeWorldId = app.worlds.some(w => w.id === storedActive) ? storedActive : (app.worlds[0]?.id || null);
  if (app.activeWorldId) {
    app.world = await dbGet('worlds', app.activeWorldId);
    app.packs = await getInstalledPacks(app.activeWorldId);
    if (storedActive !== app.activeWorldId) await setSetting('activeWorldId', app.activeWorldId);
  } else {
    app.world = null; app.packs = [];
  }
  app.settings.direction = await getSetting('promptDirection', '');
  app.settings.profile = await getSetting('promptProfile', 'bedtime');
  app.selectedItemId = null;
  renderAll();
}

async function switchWorld(worldId) {
  if (worldId === app.activeWorldId) return;
  await setSetting('activeWorldId', worldId);
  await loadAllState(worldId);
  setView('story');
}

function renderAll() {
  $('#brandTitle').textContent = app.world ? app.world.title : 'AXM Pocket Adventure';
  $('#promptBtn').textContent = app.world ? 'NEXT PROMPT' : 'FIRST PROMPT';

function setView(view) {
  if (!app.world && view !== 'system') view = 'system';
  app.view = view;
  for (const section of $$('.view')) section.classList.toggle('active', section.id === `view${capitalize(view)}`);
  for (const button of $$('.nav-btn')) button.classList.toggle('active', button.dataset.view === view);
  if (view === 'story') renderStory();
  if (view === 'map') renderMap();
  if (view === 'items') renderItems();

}

function capitalize(value) { return value.charAt(0).toUpperCase() + value.slice(1); }

function renderStory() {

    inner.append(p, actions); card.append(inner); root.append(card); return;
  }
  const scene = app.world.entities.scenes[app.world.currentSceneId];

  const card = el('article', 'card scene-card');

  }

  const choices = el('div','choices');
  const visibleChoices = scene.choices.filter(c => c.active !== false && evalCondition(c.visibleWhen, app.world));

  body.append(choices); card.append(body); root.append(card);
  renderSceneVisual(scene, visual);
}

async function renderSceneVisual(scene, visualRoot) {
  const token = ++app.renderToken;
  clearAssetUrls();
  visualRoot.textContent = '';
  visualRoot.style.aspectRatio = String(scene.visual?.aspect || '4 / 5').replace('/', ' / ');
  const placeholder = el('div','visual-placeholder','Loading scene…'); visualRoot.append(placeholder);
  const refs = [];
  if (scene.visual?.backgroundAssetId) refs.push({ kind: 'background', assetId: scene.visual.backgroundAssetId });
  for (const layer of [...(scene.visual?.layers || [])].sort((a,b) => a.z - b.z)) refs.push({ kind: 'layer', assetId: layer.assetId, layer });
  if (!refs.length) { placeholder.textContent = 'This scene has no visual asset yet.'; return; }
  try {
    for (const ref of refs) {
      const url = await getAssetUrl(ref.assetId);
      if (token !== app.renderToken) return;
      const img = document.createElement('img'); img.alt = ''; img.src = url;
      if (ref.kind === 'background') {
        img.className = 'visual-background';
        img.style.objectFit = scene.visual?.fit || 'cover';
      } else {
        const l = ref.layer; img.className = 'visual-layer';
        img.style.left = `${l.x}%`; img.style.top = `${l.y}%`;
        img.style.width = `${l.width}%`; img.style.height = `${l.height}%`;
        img.style.opacity = String(l.opacity); img.style.zIndex = String(l.z);
        img.style.objectFit = l.fit; img.style.mixBlendMode = l.blendMode;
        img.style.transform = `translate(-50%, -50%) rotate(${l.rotation}deg)`;
      }
      visualRoot.append(img);
    }
    placeholder.remove();
  } catch (error) {
    placeholder.textContent = `Visual unavailable: ${error.message}`;
  }
}

async function getAssetUrl(assetId) {
  if (app.assetUrls.has(assetId)) return app.assetUrls.get(assetId);
  const record = await dbGet('assets', `${app.world.id}::${assetId}`);
  if (!record?.blob) throw new Error(`asset ${assetId} is missing from phone storage`);
  const url = URL.createObjectURL(record.blob);
  app.assetUrls.set(assetId, url);
  return url;
}

function clearAssetUrls() {
  for (const url of app.assetUrls.values()) URL.revokeObjectURL(url);
  app.assetUrls.clear();
}
