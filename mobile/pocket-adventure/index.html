function label(value) { return el('label','form-label',value); }

async function estimateStorage(node) {
  try {
    if (!navigator.storage?.estimate) { node.textContent = 'Storage estimate is not exposed by this browser.'; return; }
    const { usage = 0, quota = 0 } = await navigator.storage.estimate();
    node.textContent = `${formatBytes(usage)} used · ${formatBytes(quota)} available quota`;
  } catch { node.textContent = 'Storage estimate unavailable.'; }
}

function getSelectedItem() {
  if (!app.world || !app.selectedItemId || !(app.world.state.inventory[app.selectedItemId] > 0)) return null;
  return app.world.entities.items[app.selectedItemId] || null;
}

function evalCondition(condition, world) {
  if (condition == null || condition === true) return true;
  if (condition === false) return false;
  if (Array.isArray(condition)) return condition.every(c => evalCondition(c, world));
  if (typeof condition !== 'object') return Boolean(condition);
  if (condition.all) return arrayOf(condition.all).every(c => evalCondition(c, world));
  if (condition.any) return arrayOf(condition.any).some(c => evalCondition(c, world));
  if (condition.not) return !evalCondition(condition.not, world);
  if (condition.flag) return compareValue(world.state.flags[condition.flag], condition);
  if (condition.counter) return compareValue(Number(world.state.counters[condition.counter] || 0), condition);
  if (condition.hasItem) return Number(world.state.inventory[condition.hasItem] || 0) >= Number(condition.count || 1);
  if (condition.visitedScene) return Number(world.state.visitedScenes[condition.visitedScene] || 0) >= Number(condition.count || 1);
  if (condition.currentLocation) return world.currentLocationId === condition.currentLocation;
  if (condition.hookActive) return world.state.hooks[condition.hookActive]?.status === 'active';
  if (condition.hookAtLocation) {
    const runtime = world.state.hooks[condition.hookAtLocation];
    return runtime?.status === 'active' && runtime.locationId === (condition.locationId || world.currentLocationId);
  }
  return true;
}

function compareValue(actual, condition) {
  if ('equals' in condition) return actual === condition.equals;
  if ('notEquals' in condition) return actual !== condition.notEquals;
  if ('gte' in condition && !(actual >= condition.gte)) return false;
  if ('lte' in condition && !(actual <= condition.lte)) return false;
  if ('gt' in condition && !(actual > condition.gt)) return false;
  if ('lt' in condition && !(actual < condition.lt)) return false;
  return true;
}

function matchingItemResponse(choice, item, world) {
  if (!item) return null;
  const candidates = choice.itemResponses.filter(response => {
    if (!evalCondition(response.when, world)) return false;
    const match = response.match || {};
    const idMatch = !match.itemIds?.length || match.itemIds.includes(item.id);
    const allMatch = !match.allTags?.length || match.allTags.every(tag => item.tags.includes(tag));
    const anyMatch = !match.anyTags?.length || match.anyTags.some(tag => item.tags.includes(tag));
    return idMatch && allMatch && anyMatch && (match.itemIds?.length || match.allTags?.length || match.anyTags?.length);
  });
  return candidates.sort((a,b) => scoreResponse(b,item) - scoreResponse(a,item))[0] || null;
}

function scoreResponse(response, item) {
  let score = Number(response.priority || 0) * 100;
  if (response.match.itemIds?.includes(item.id)) score += 50;
  score += (response.match.allTags?.length || 0) * 8;
  score += (response.match.anyTags?.filter(t => item.tags.includes(t)).length || 0) * 3;
  return score;
}

async function choose(scene, choice) {
  if (app.busy) return;
  const world = app.world;
  const item = getSelectedItem();
  const response = matchingItemResponse(choice, item, world);
  if (item && !response) {
    world.state.history.push({ turn: world.state.turn, type: 'item-attempt', sceneId: scene.id, choiceId: choice.id, itemId: item.id, summary: `${item.name} did not clearly change ${choice.label}.` });
    trimHistory(world);
    world.stateRevision++;
    await saveWorld();
    showOutcome(world.defaultNoEffectText, false);
    return;
  }

  const usingResponse = Boolean(response);
  const completesChoice = usingResponse ? response.completesChoice : true;
  const mode = response?.mode || 'replace';
  const effects = usingResponse ? (mode === 'augment' ? [...choice.effects, ...response.effects] : response.effects) : choice.effects;
  const to = usingResponse ? (response.to || (completesChoice ? choice.to : null)) : choice.to;
  const resultText = usingResponse ? (response.resultText || choice.resultText) : choice.resultText;
  const advanceTurns = usingResponse ? response.advanceTurns : 1;

  if (completesChoice) registerUnchosenHooks(scene, choice.id, world);
  applyEffects(world, effects);
  if (usingResponse && response.consume > 0) removeItem(world, item.id, response.consume);
  const previousSceneId = world.currentSceneId;
  if (to) {
    world.currentSceneId = to;
    const nextScene = world.entities.scenes[to];
    world.currentLocationId = nextScene.locationId;
    const firstVisit = !world.state.visitedScenes[to];
    world.state.visitedScenes[to] = Number(world.state.visitedScenes[to] || 0) + 1;
    if (firstVisit) applyEffects(world, nextScene.onEnter || []);
  }
  if (advanceTurns > 0) {
    world.state.turn += advanceTurns;
    world.state.day = 1 + Math.floor(world.state.turn / 12);
    advanceWanderingHooks(world);
  }
  world.state.history.push({
    turn: world.state.turn,
    type: usingResponse ? 'item-choice' : 'choice',
    sceneId: previousSceneId,
    choiceId: choice.id,
    itemId: item?.id || null,
    to: to || previousSceneId,
    summary: limitedHistory(resultText || choice.label)
  });
  trimHistory(world);
  world.stateRevision++;
  app.selectedItemId = null;
  await saveWorld();
  showOutcome(resultText || (to ? 'The world shifts around your decision.' : 'Something changes, even if only slightly.'), true);
}

function registerUnchosenHooks(scene, chosenChoiceId, world) {
  for (const choice of scene.choices) {
    if (choice.id === chosenChoiceId || !choice.active || !evalCondition(choice.visibleWhen, world)) continue;
    const hookId = choice.onUnchosen?.hookId;
    if (!hookId || world.state.hooks[hookId]?.status === 'resolved') continue;
    const def = world.entities.hooks[hookId];
    world.state.hooks[hookId] ||= {
      status: 'active',
      locationId: choice.onUnchosen.locationId || def.startLocationId || scene.locationId,
      createdTurn: world.state.turn,
      lastMovedTurn: world.state.turn,
      sourceSceneId: scene.id,
      sourceChoiceId: choice.id
    };
  }
}

function applyEffects(world, effects) {
  for (const effect of arrayOf(effects)) {
    if (effect.type === 'setFlag') world.state.flags[effect.key] = effect.value;
    if (effect.type === 'increment') world.state.counters[effect.key] = Number(world.state.counters[effect.key] || 0) + Number(effect.amount || 1);
    if (effect.type === 'giveItem') addItem(world, effect.itemId, Number(effect.count || 1));
    if (effect.type === 'takeItem') removeItem(world, effect.itemId, Number(effect.count || 1));
    if (effect.type === 'activateHook') {
      const def = world.entities.hooks[effect.hookId];
      if (def) world.state.hooks[effect.hookId] = { status: 'active', locationId: effect.locationId || def.startLocationId || world.currentLocationId, createdTurn: world.state.turn, lastMovedTurn: world.state.turn };
    }
    if (effect.type === 'resolveHook' && world.state.hooks[effect.hookId]) world.state.hooks[effect.hookId].status = 'resolved';
    if (effect.type === 'setSceneState') {
      world.state.sceneStates[effect.sceneId || world.currentSceneId] ||= {};
      world.state.sceneStates[effect.sceneId || world.currentSceneId][effect.key] = effect.value;
    }
    if (effect.type === 'setLocationState') {
      world.state.locationStates[effect.locationId || world.currentLocationId] ||= {};
      world.state.locationStates[effect.locationId || world.currentLocationId][effect.key] = effect.value;
    }
    if (effect.type === 'advanceTime') {
      world.state.turn += Math.max(0, Number(effect.turns || 0));
      world.state.day = 1 + Math.floor(world.state.turn / 12);
    }
  }
}

function addItem(world, itemId, count) {
  if (!world.entities.items[itemId]) throw new Error(`Effect gives unknown item: ${itemId}`);
  world.state.inventory[itemId] = Number(world.state.inventory[itemId] || 0) + Math.max(0, count);
}

function removeItem(world, itemId, count) {
  world.state.inventory[itemId] = Math.max(0, Number(world.state.inventory[itemId] || 0) - Math.max(0, count));
}

function advanceWanderingHooks(world) {
  const turn = world.state.turn;
  for (const [hookId, runtime] of Object.entries(world.state.hooks)) {
    if (runtime.status !== 'active') continue;
    const def = world.entities.hooks[hookId];
    const movement = def?.movement;
    if (!movement || movement.mode !== 'wander') continue;
    const every = Math.max(1, Number(movement.everyTurns || 2));
    if (turn - Number(runtime.lastMovedTurn || runtime.createdTurn || 0) < every) continue;
    const location = world.entities.locations[runtime.locationId];
    if (!location) continue;
    const allowedTags = movement.allowedLocationTags || [];
    const candidates = (location.neighbors || []).map(id => world.entities.locations[id]).filter(Boolean).filter(loc => !allowedTags.length || allowedTags.some(tag => loc.tags.includes(tag))).sort((a,b) => a.id.localeCompare(b.id));
    if (!candidates.length) continue;
    const index = parseInt(fnv1a64(`${hookId}|${turn}|${runtime.locationId}`).slice(-8), 16) % candidates.length;
    runtime.locationId = candidates[index].id;
    runtime.lastMovedTurn = turn;
  }
}

function trimHistory(world) { if (world.state.history.length > 120) world.state.history = world.state.history.slice(-120); }
function limitedHistory(value) { const v = text(value).replace(/\s+/g,' ').trim(); return v.length > 320 ? `${v.slice(0,317)}…` : v; }

async function saveWorld() {
  await dbPut('worlds', app.world);
  app.worlds = app.worlds.map(w => w.id === app.world.id ? clone(app.world) : w);
  renderAll();
}

function showOutcome(message, renderAfterClose) {
  const body = el('div','outcome-text',message);
  openModal('What happened', body, [modalButton('Continue','action-btn',() => { closeModal(); if (renderAfterClose) { setView('story'); } })]);
}

function createHandoffSnapshot(world, packs) {
  const state = world.state;
  const history = state.history.slice(-20);
  const recentSceneIds = [...new Set([world.currentSceneId, ...history.map(h => h.sceneId), ...history.map(h => h.to)].filter(Boolean))];
  const currentLocation = world.entities.locations[world.currentLocationId];
  const nearbyLocations = new Set([world.currentLocationId, ...(currentLocation?.neighbors || [])]);
  for (const scene of Object.values(world.entities.scenes)) if (nearbyLocations.has(scene.locationId)) recentSceneIds.push(scene.id);
  const focusSceneIds = [...new Set(recentSceneIds)].slice(-80).sort();
  const inventory = Object.entries(state.inventory).filter(([,count]) => count > 0).sort(([a],[b]) => a.localeCompare(b)).map(([id,count]) => {
    const item = world.entities.items[id];
    return { id, count, name: item?.name || id, tags: item?.tags || [], revision: item?.revision || 0 };
  });
  const activeHooks = Object.entries(state.hooks).filter(([,runtime]) => runtime.status === 'active').sort(([a],[b]) => a.localeCompare(b)).map(([id,runtime]) => {
    const def = world.entities.hooks[id];
    return { id, summary: def?.summary || id, tags: def?.tags || [], locationId: runtime.locationId, createdTurn: runtime.createdTurn, sourceSceneId: runtime.sourceSceneId || null, sourceChoiceId: runtime.sourceChoiceId || null, revision: def?.revision || 0 };
  });
  const sceneIndex = focusSceneIds.map(id => world.entities.scenes[id]).filter(Boolean).map(scene => ({
    id: scene.id,
    title: scene.title,
    locationId: scene.locationId,
    tags: scene.tags,
    revision: scene.revision,
    choices: scene.choices.filter(c => c.active !== false).map(c => ({ id: c.id, label: c.label, to: c.to || null, itemResponseIds: c.itemResponses.map(r => r.id), onUnchosenHookId: c.onUnchosen?.hookId || null }))
  }));
  const allIds = {};
  const omitted = {};
  for (const domain of ENTITY_DOMAINS) {
    const ids = Object.keys(world.entities[domain]).sort();
    allIds[domain] = ids.slice(0, 600).map(id => `${id}@${world.entities[domain][id].revision || 0}`);
    omitted[domain] = Math.max(0, ids.length - allIds[domain].length);
  }
  const fullRegistry = ENTITY_DOMAINS.flatMap(domain => Object.keys(world.entities[domain]).sort().map(id => `${domain}:${id}@${world.entities[domain][id].revision || 0}`));
  return canonicalize({
    schema: ENGINE.handoffSchema,
    engineVersion: ENGINE.version,
    packSchema: ENGINE.packSchema,
    world: {
      id: world.id,
      title: world.title,
      summary: world.summary,
      tone: world.tone,
      currentSceneId: world.currentSceneId,
      currentLocationId: world.currentLocationId,
      turn: state.turn,
      day: state.day,
      contentRevision: world.contentRevision,
      stateRevision: world.stateRevision,
      nextPackSequence: world.nextPackSequence,
      continuity: world.continuity,
      generationRules: world.generationRules
    },
    installedPacks: packs.slice().sort((a,b) => a.installOrder - b.installOrder).map(p => ({ packId: p.packId, packVersion: p.packVersion, type: p.type, installOrder: p.installOrder })),
    liveState: {
      flags: canonicalize(state.flags),
      counters: canonicalize(state.counters),
      inventory,
      activeHooks,
      currentLocationState: canonicalize(state.locationStates[world.currentLocationId] || {}),
      currentSceneState: canonicalize(state.sceneStates[world.currentSceneId] || {}),
      recentHistory: history.map(h => ({ turn: h.turn, type: h.type, sceneId: h.sceneId, choiceId: h.choiceId || null, itemId: h.itemId || null, to: h.to || null, summary: h.summary }))
    },
    focusedCompatibilityIndex: {
      scenes: sceneIndex,
      locations: Object.values(world.entities.locations).filter(loc => nearbyLocations.has(loc.id)).sort((a,b) => a.id.localeCompare(b.id)).map(loc => ({ id: loc.id, name: loc.name, tags: loc.tags, neighbors: loc.neighbors, revision: loc.revision })),
      inventoryItems: inventory,
      activeHooks
    },
    registry: {
      counts: Object.fromEntries(ENTITY_DOMAINS.map(domain => [domain, Object.keys(world.entities[domain]).length])),
      registryHash: fnv1a64(fullRegistry.join('\n')),
      ids: allIds,
      omitted
    }
  });
}

function profileRules(profile) {
  if (profile === 'small') return { scenes: '4–6', locations: '0–2', items: '0–2', interactions: '3–6', maxMb: 22 };
  if (profile === 'deep') return { scenes: '9–12', locations: '1–4', items: '1–4', interactions: '7–14', maxMb: 60 };
  return { scenes: '6–8', locations: '1–3', items: '1–3', interactions: '5–10', maxMb: 35 };
}

function buildPrompt() {
  const rules = profileRules(app.settings.profile);
  const direction = app.settings.direction || 'Continue with a grounded surprise that fits the established tone and unresolved world state.';
  const snapshot = app.world ? createHandoffSnapshot(app.world, app.packs) : null;
  const stateHash = snapshot ? fnv1a64(canonicalString(snapshot)) : 'NEW_WORLD';
  const sequence = app.world ? app.world.nextPackSequence : 0;
  const requestedPackId = app.world ? `${app.world.id}.patch.${String(sequence).padStart(4,'0')}` : 'axm.world.first.core';
  const requestedType = app.world ? 'expansion' : 'world';
  const worldId = app.world ? app.world.id : 'axm.world.first';
  return `AXM POCKET ADVENTURE — DETERMINISTIC PACK BUILD REQUEST\n\nDO THE WORK IN THIS CHAT. Create the complete downloadable ZIP cartridge; do not merely describe it. The phone engine is permanent and content-free. This request is only for a compatible external story cartridge.\n\nREQUEST\n- Pack type: ${requestedType}\n- Required pack ID: ${requestedPackId}\n- Required world ID: ${worldId}\n- Required pack schema: ${ENGINE.packSchema}\n- Minimum engine version: ${ENGINE.version}\n- Generation sequence: ${sequence}\n- builtFromStateHash: ${stateHash}\n- Direction: ${direction}\n- Budget: ${rules.scenes} new scenes, ${rules.locations} new locations, ${rules.items} curious reusable items, ${rules.interactions} meaningful cross-item interactions, total ZIP at or below ${rules.maxMb} MB.\n\nNON-NEGOTIABLE EXPERIENCE RULES\n1. Make it an entertaining image-led choice adventure: each scene gets an AI-generated visual, concise atmospheric storytelling, and 2–4 genuinely different choices.\n2. Preserve continuity. Use the handoff below as authority; never silently rewrite established IDs, facts, state, item ownership, map position, or resolved history.\n3. Curiosity items are world tools, not single-use designer keys. New items should have multiple plausible uses across different choices, contexts, or future hooks. Add new responses to existing inventory items when natural. A failed experiment may be funny, revealing, risky, delayed, or simply do nothing; it must not fake a forced puzzle answer.\n4. Unchosen possibilities may remain alive. Use declared hook entities plus choice.onUnchosen so missed paths can stay local, wander through mapped neighbors, or reappear later.\n5. Keep pacing lean. No filler scenes, duplicate images, fake currencies, grinding, artificial scarcity, daily-pressure loops, or exposition dumps.\n6. This is a patch/content job only. Do not include HTML, JavaScript, a replacement engine, Base64 assets, external URLs, trackers, or network dependencies.\n7. Additive by default. Existing entities may change only through explicit operations with the exact expectedRevision shown in the focused compatibility index. Do not guess revisions for omitted entities.\n8. Update worldPatch.continuity with a compact recap/current arc/open questions so the next deterministic prompt remains useful without carrying the full adventure text.\n\nZIP RULES\n- ZIP root must contain manifest.json.\n- Put structured content in content/world.json.\n- Put images under assets/. Use WebP/JPEG/PNG/SVG as appropriate; prefer phone-friendly 4:5 scene art around 1024–1350 px, and a square map image when needed.\n- Create the ZIP with STORE/no compression (Python zipfile.ZIP_STORED). Images are already compressed and this keeps the permanent phone engine dependency-free. Standard DEFLATE may work on newer browsers but STORE is required for broad compatibility.\n- All JSON is UTF-8. All paths are relative, use forward slashes, and contain no .. segments.\n- Compute lowercase SHA-256 for content/world.json and every listed asset after final bytes are written.\n- Use globally namespaced IDs beginning with the required pack ID for new entities and assets.\n- Keep each file below 32 MB and the whole ZIP within the stated budget.\n\nREQUIRED manifest.json SHAPE\n{\n  "schema": "${ENGINE.packSchema}",\n  "packId": "${requestedPackId}",\n  "packVersion": "1.0.0",\n  "type": "${requestedType}",\n  "worldId": "${worldId}",\n  "title": "spoiler-free pack title",\n  "engine": { "min": "${ENGINE.version}", "max": "0.1.x" },\n  "content": { "path": "content/world.json", "sha256": "lowercase sha256" },\n  "assets": [\n    { "id": "namespaced.asset.id", "path": "assets/file.webp", "mediaType": "image/webp", "role": "scene|map|layer|item", "sha256": "lowercase sha256" }\n  ],\n  "dependencies": [ { "packId": "installed pack ID", "minVersion": "installed version" } ],\n  "builtFromStateHash": ${app.world ? `"${stateHash}"` : 'null'},\n  "generation": { "sequence": ${sequence} },\n  "installPolicy": { "mode": "append-only", "allowStale": false }\n}\nFor a first world pack, dependencies may be empty, builtFromStateHash is null, and generation.sequence is 0. For every continuation pack, builtFromStateHash and sequence must match this request exactly.\n\nREQUIRED content/world.json SHAPE\n{\n  "world": ${app.world ? 'omit this field for continuation packs' : '{ "id": "axm.world.first", "title": "...", "summary": "...", "tone": "...", "startSceneId": "...", "startLocationId": "...", "mapAssetId": "optional asset ID", "defaultNoEffectText": "...", "generationRules": [], "continuity": { "worldBible": "...", "currentArc": "...", "recap": "...", "openQuestions": [], "recentSummaries": [] } }'},\n  "additions": {\n    "locations": [ { "id": "...", "revision": 1, "name": "...", "description": "...", "x": 0, "y": 0, "tags": [], "neighbors": [], "unlockedWhen": null } ],\n    "items": [ { "id": "...", "revision": 1, "name": "...", "description": "...", "curiosity": "...", "tags": ["tool","social"], "stackable": false } ],\n    "hooks": [ { "id": "...", "revision": 1, "summary": "...", "tags": [], "startLocationId": "...", "movement": { "mode": "stationary|wander", "everyTurns": 2, "allowedLocationTags": [] } } ],\n    "scenes": [\n      {\n        "id": "...", "revision": 1, "title": "...", "mood": "...", "narration": ["paragraph"], "locationId": "...", "tags": [],\n        "visual": { "backgroundAssetId": "...", "fit": "cover", "aspect": "4/5", "layers": [ { "assetId": "...", "x": 50, "y": 50, "width": 100, "height": 100, "rotation": 0, "opacity": 1, "z": 1, "blendMode": "normal", "fit": "contain" } ] },\n        "onEnter": [],\n        "choices": [\n          {\n            "id": "...", "label": "...", "hint": "...", "to": "scene ID or null", "resultText": "...", "visibleWhen": null, "enabledWhen": null, "lockedText": "...",\n            "effects": [ { "type": "setFlag|increment|giveItem|takeItem|activateHook|resolveHook|setSceneState|setLocationState|advanceTime", "key": "...", "value": true } ],\n            "onUnchosen": { "hookId": "declared hook ID", "locationId": "optional location ID" },\n            "itemResponses": [\n              { "id": "...", "match": { "itemIds": [], "anyTags": ["tool"], "allTags": [] }, "mode": "replace|augment", "completesChoice": true, "advanceTurns": 1, "consume": 0, "priority": 0, "resultText": "...", "effects": [], "to": "optional scene ID", "when": null }\n            ]\n          }\n        ]\n      }\n    ]\n  },\n  "operations": [\n    { "op": "addChoice", "sceneId": "existing focused scene ID", "expectedRevision": 1, "choice": { } },\n    { "op": "addItemResponse", "sceneId": "existing focused scene ID", "choiceId": "existing choice ID", "expectedRevision": 1, "response": { } },\n    { "op": "mergeEntity", "domain": "locations|items|hooks|scenes", "id": "existing focused ID", "expectedRevision": 1, "changes": { }, "reason": "explicit reason" },\n    { "op": "deactivateChoice", "sceneId": "...", "choiceId": "...", "expectedRevision": 1, "reason": "explicit reason" }\n  ],\n  "worldPatch": { "summary": "optional", "tone": "optional", "mapAssetId": "optional", "generationRules": [], "continuity": { "worldBible": "bounded", "currentArc": "bounded", "recap": "bounded", "openQuestions": [], "recentSummaries": [] } }\n}\nOnly include operation types actually needed. Revisions advance in operation order, so later operations on the same entity must use the newly incremented revision. Every scene/location/item/hook/choice/asset reference must resolve after the complete pack is applied.\n\nCURRENT AUTHORITATIVE HANDOFF\n${snapshot ? JSON.stringify(snapshot, null, 2) : JSON.stringify({ schema: ENGINE.handoffSchema, engineVersion: ENGINE.version, packSchema: ENGINE.packSchema, world: null, instruction: 'Create a new world pack. The engine contains no adventure data.' }, null, 2)}\n\nFINAL VERIFICATION BEFORE RETURNING\n- Open the ZIP programmatically and re-read manifest.json and content/world.json.\n- Verify every listed path exists, every SHA-256 matches, every new ID is unique, every reference resolves, and ZIP compression is STORE.\n- For a continuation pack, verify builtFromStateHash=${stateHash} and generation.sequence=${sequence}.\n- Do not reveal scene pictures, plot twists, full narration, or choice outcomes in the chat. Return only the downloadable ZIP, pack ID/version, compatibility result, and one spoiler-free sentence.\n`;
}

function showPrompt() {
  const prompt = buildPrompt();
  const body = document.createElement('div');
  const notice = el('div','notice ok', app.world ? 'This prompt was generated entirely from the phone’s current structured state. Same state + same direction + same size setting produces the same prompt.' : 'This is the stable bootstrap prompt. Import the returned base cartridge, then future prompts will carry the world forward.');
  const area = el('textarea','prompt-area'); area.value = prompt; area.readOnly = true;
  body.append(notice, area);
  openModal(app.world ? 'Next pack prompt' : 'First adventure prompt', body, [
    modalButton('Download .txt','secondary-btn',() => downloadText(app.world ? `${app.world.id}_next_pack_prompt.txt` : 'AXM_first_adventure_prompt.txt', prompt)),
    modalButton('Copy prompt','action-btn',async () => { const ok = await copyText(prompt, area); toast(ok ? 'Prompt copied.' : 'Copy blocked; the prompt remains selected.'); })
  ]);
  setTimeout(() => area.scrollTop = 0, 0);
}

async function copyText(value, fallbackArea) {
  try { if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(value); return true; } } catch {}
  try { fallbackArea.focus(); fallbackArea.select(); return document.execCommand('copy'); } catch { return false; }
}

async function exportHandoff() {
  if (!app.world) return;
  const snapshot = createHandoffSnapshot(app.world, app.packs);
  const payload = { stateHash: fnv1a64(canonicalString(snapshot)), handoff: snapshot };
  downloadText(`${app.world.id}_handoff.json`, JSON.stringify(payload,null,2), 'application/json');
}

function downloadText(filename, value, mime = 'text/plain;charset=utf-8') {
  const url = URL.createObjectURL(new Blob([value], { type: mime }));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function undoLastTakeIn() {
  if (!app.world) return;
  const snapshots = (await dbGetAllByIndex('snapshots','worldId',app.world.id)).sort((a,b) => b.installOrder - a.installOrder || b.id - a.id);
  const snapshot = snapshots[0];
  if (!snapshot) { toast('No intake snapshot is available.'); return; }
  if (app.world.contentRevision !== snapshot.contentRevisionAfter || app.world.stateRevision !== snapshot.stateRevisionAfter) {
    showError('Undo protected', new Error('The world has changed since that cartridge was installed. Automatic undo is blocked so later play is not silently erased.'));
    return;
  }
  const body = el('div','outcome-text',`Remove ${snapshot.packId} and restore the exact world state from before it was taken in?`);
  openModal('Undo last take-in', body, [
    modalButton('Cancel','secondary-btn',closeModal),
    modalButton('Undo safely','danger-btn',async () => {
      closeModal();
      const tx = app.db.transaction(['worlds','packs','assets','snapshots','settings'],'readwrite');
      if (snapshot.worldBefore) tx.objectStore('worlds').put(snapshot.worldBefore); else tx.objectStore('worlds').delete(snapshot.worldId);
      tx.objectStore('packs').delete(snapshot.packKey);
      for (const key of snapshot.assetKeys) tx.objectStore('assets').delete(key);
      tx.objectStore('snapshots').delete(snapshot.id);
      if (!snapshot.worldBefore) tx.objectStore('settings').put({ key:'activeWorldId', value:null });
      await txDone(tx);
      await loadAllState(snapshot.worldBefore?.id || null);
      toast(`Undid ${snapshot.packId}.`);
    })
  ]);
}

function showError(title, error) {
  const body = document.createElement('div');
  body.append(el('div','notice',error?.message || String(error)));
  openModal(title, body, [modalButton('Close','secondary-btn',closeModal)]);
  console.warn(error);
}

function openModal(title, body, actions = [], closable = true) {
  $('#modalTitle').textContent = title;
  const modalBody = $('#modalBody'); modalBody.textContent = ''; modalBody.append(body);
  const modalActions = $('#modalActions'); modalActions.textContent = ''; actions.forEach(action => modalActions.append(action));
  $('#modalClose').hidden = !closable;
  $('#modalBackdrop').hidden = false;
}

function closeModal() { if (!app.busy || !$('#modalClose').hidden) $('#modalBackdrop').hidden = true; }
function modalButton(label, className, handler) { return button(label, className, handler); }
function button(labelText, className, handler) { const b = el('button',className,labelText); b.type = 'button'; b.addEventListener('click',handler); return b; }
function el(tag, className = '', content = null) { const node = document.createElement(tag); if (className) node.className = className; if (content != null) node.textContent = String(content); return node; }

let toastTimer = null;
function toast(message, isError = false) {
  const node = $('#toast'); node.textContent = message; node.classList.toggle('error',isError); node.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => node.classList.remove('show'), 2600);
}

async function init() {
  try {
    if (!('indexedDB' in globalThis)) throw new Error('This browser does not expose IndexedDB storage.');
    app.db = await openDatabase();
    await loadAllState();
    $('#takeInBtn').addEventListener('click', () => $('#packInput').click());
    $('#promptBtn').addEventListener('click', showPrompt);
    $('#packInput').addEventListener('change', event => { const file = event.target.files?.[0]; if (file) importPack(file); });
    for (const b of $$('.nav-btn')) b.addEventListener('click', () => setView(b.dataset.view));
    $('#modalClose').addEventListener('click', closeModal);
    $('#modalBackdrop').addEventListener('click', event => { if (event.target === $('#modalBackdrop') && !app.busy) closeModal(); });
    addEventListener('beforeunload', clearAssetUrls);
  } catch (error) {
    $('#viewStory').textContent = '';
    const card = el('div','card empty');
    const inner = document.createElement('div'); inner.append(el('h2','','Storage could not start'), el('p','',error.message)); card.append(inner); $('#viewStory').append(card);
    showError('Engine start failed', error);
  }
}

init();
</script>
