<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AXM Memory & Continuity Garden</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">AXM / MEMORY & CONTINUITY</p>
      <h1>A working map of what memory may become.</h1>
      <p class="intro">One hundred sealed reference contracts, preserved with their risk, authority, dissent, and proof boundaries. This garden helps us inspect and route them—it does not pretend they are finished semantic implementations.</p>
      <div id="metrics" class="metrics" aria-label="Garden metrics"></div>
    </header>
    <section class="controls" aria-label="Catalog controls">
      <label>Search contracts<input id="search" type="search" placeholder="Try continuity, consent, rollback, provenance…"></label>
      <label>Risk<select id="risk"><option value="">All risks</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option></select></label>
      <label>Posture<select id="posture"><option value="">All postures</option></select></label>
    </section>
    <p id="status" class="status" role="status"></p>
    <section id="catalog" class="catalog" aria-label="Memory candidate catalog"></section>
  </main>
  <dialog id="detail"><button id="close" aria-label="Close">×</button><div id="detailBody"></div></dialog>
  <script src="app.js"></script>
</body>
</html>
