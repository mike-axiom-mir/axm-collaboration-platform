<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calibration Lab</title><link rel="stylesheet" href="../../shared/cognitive-resource/labs-ui.css"></head><body><header><a href="../cognitive-resource-meter/index.html">&larr; Meter</a><div><span class="eyebrow">PREDICTION ↔ EXACT RECEIPT</span><h1>Cognitive Calibration & Benchmark Lab</h1><p>Comparison evidence, never cheapest-model authority.</p></div></header><main><section class="panel"><p class="boundary">The actual value must exactly match a bound Meter observation. Interval coverage is not a calibrated-accuracy claim.</p><div class="form"><label class="wide">Observation record ID<input id="observationId"></label><label>Dimension<select id="dimension"><option>TOKENS</option><option>CPU_CORE_MILLISECONDS</option><option>ACCELERATOR_MILLISECONDS</option><option>WALL_MILLISECONDS</option><option>MONEY_MICROS</option><option>ENERGY_MILLIWATT_HOURS</option><option>CARBON_MILLIGRAMS</option></select></label><label>Unit<input id="unit" value="TOKENS" readonly></label><label>Predicted lower bound<input id="lower" type="number" min="0"></label><label>Predicted upper bound<input id="upper" type="number" min="0"></label><label>Observed value<input id="actual" type="number" min="0" readonly></label><label>Observation digest<input id="observationDigest" readonly></label></div><div class="toolbar"><button id="bind">Load exact observation</button><button id="capture">Archive comparison</button></div></section><section class="panel"><h2>Calibration records</h2><div id="records" class="cards"></div></section><section class="panel"><pre id="out" class="code">No comparison yet.</pre></section></main><script src="../../shared/operations/operations-client.js"></script><script src="app.js"></script></body></html>
