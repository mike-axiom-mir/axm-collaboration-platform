<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">AXM Shapeable Builder mark</title>
  <desc id="desc">Three connected layers surrounding one shared source point.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="10" x2="108" y2="119" gradientUnits="userSpaceOnUse">
      <stop stop-color="#112b38"/>
      <stop offset="1" stop-color="#07131d"/>
    </linearGradient>
    <linearGradient id="logic" x1="17" y1="30" x2="64" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8bfff4"/>
      <stop offset="1" stop-color="#20a99f"/>
    </linearGradient>
    <linearGradient id="cap" x1="64" y1="22" x2="112" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c7b5ff"/>
      <stop offset="1" stop-color="#7253df"/>
    </linearGradient>
    <linearGradient id="visual" x1="39" y1="68" x2="89" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd99a"/>
      <stop offset="1" stop-color="#e88d35"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="118" height="118" rx="31" fill="url(#bg)" stroke="#a2d6e8" stroke-opacity=".22" stroke-width="2"/>
  <path d="M64 20 104 43v46L64 112 24 89V43Z" fill="none" stroke="#dff7ff" stroke-opacity=".11"/>
  <path d="M64 30 94 47v34L64 98 34 81V47Z" fill="none" stroke="#dff7ff" stroke-opacity=".1" stroke-dasharray="3 5"/>
  <path d="M60 60 38 47" stroke="url(#logic)" stroke-width="4" stroke-linecap="round"/>
  <path d="m68 60 22-13" stroke="url(#cap)" stroke-width="4" stroke-linecap="round"/>
  <path d="M64 68v27" stroke="url(#visual)" stroke-width="4" stroke-linecap="round"/>
  <rect x="22" y="27" width="31" height="31" rx="10" fill="#0a1b24" stroke="url(#logic)" stroke-width="3"/>
  <path d="M30 37h8v8h-8zm13 9 4 4m-9-5v6h6" fill="none" stroke="#8bfff4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="75" y="27" width="31" height="31" rx="10" fill="#0b1826" stroke="url(#cap)" stroke-width="3"/>
  <path d="m90.5 34 3 2 3.5-.5.5 3.5 2 3-2 3-.5 3.5-3.5-.5-3 2-3-2-3.5.5-.5-3.5-2-3 2-3 .5-3.5 3.5.5Z" fill="none" stroke="#c7b5ff" stroke-width="1.7"/>
  <rect x="48.5" y="79" width="31" height="31" rx="10" fill="#151b20" stroke="url(#visual)" stroke-width="3"/>
  <path d="M55 87h18v14H55zm0 4h18m-13 5 3-3 3 3 2-2" fill="none" stroke="#ffd99a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="64" cy="64" r="9" fill="#07131d" stroke="#effcff" stroke-opacity=".58" stroke-width="2" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="3.5" fill="#effcff"/>
</svg>
