<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">AXM Workshop command core</title><desc id="desc">A cyan and violet orbital command core with five connected workspace nodes.</desc>
  <defs>
    <radialGradient id="bg"><stop offset="0" stop-color="#132b49"/><stop offset=".58" stop-color="#091321"/><stop offset="1" stop-color="#040810"/></radialGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#f8ffff"/><stop offset=".18" stop-color="#88f5ff"/><stop offset=".48" stop-color="#267ea6" stop-opacity=".75"/><stop offset="1" stop-color="#0a1424" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63f3ff"/><stop offset=".5" stop-color="#8090ff"/><stop offset="1" stop-color="#ed72d8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="640" rx="48" fill="url(#bg)"/>
  <g fill="none" stroke="#6deaf4" stroke-opacity=".1"><path d="M40 120h560M40 220h560M40 320h560M40 420h560M40 520h560M120 40v560M220 40v560M320 40v560M420 40v560M520 40v560"/><circle cx="320" cy="320" r="252"/><circle cx="320" cy="320" r="204"/><circle cx="320" cy="320" r="145"/></g>
  <g stroke="url(#ring)" fill="none" filter="url(#glow)"><circle cx="320" cy="320" r="196" stroke-width="3" stroke-dasharray="9 15"/><circle cx="320" cy="320" r="137" stroke-width="2" stroke-dasharray="52 12"/><path d="M320 124L506 260M506 260L435 478M435 478H205M205 478L134 260M134 260L320 124" stroke-width="2" stroke-opacity=".58"/></g>
  <g fill="#07131f" stroke-width="3" filter="url(#glow)"><circle cx="320" cy="124" r="19" stroke="#63f3ff"/><circle cx="506" cy="260" r="19" stroke="#8ea1ff"/><circle cx="435" cy="478" r="19" stroke="#f0bd68"/><circle cx="205" cy="478" r="19" stroke="#65d6a1"/><circle cx="134" cy="260" r="19" stroke="#d490f5"/></g>
  <circle cx="320" cy="320" r="94" fill="url(#core)" filter="url(#glow)"/><circle cx="320" cy="320" r="58" fill="#071827" stroke="#77eff8" stroke-width="2"/><path d="M287 348l33-72 33 72-18-9-15 19-15-19z" fill="none" stroke="#d9fdff" stroke-width="5" stroke-linejoin="round"/>
  <text x="320" y="397" text-anchor="middle" fill="#8eeef5" font-family="ui-monospace,monospace" font-size="18" letter-spacing="6">COMMAND</text>
