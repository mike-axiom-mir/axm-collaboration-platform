<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Attention Ledger</title><link rel="stylesheet" href="../../shared/cognitive-resource/labs-ui.css"></head><body><header><a href="../cognitive-resource-meter/index.html">&larr; Meter</a><div><span class="eyebrow">OPT IN · PSEUDONYMOUS · SEPARATE</span><h1>Human Attention Ledger</h1><p>Human effort without identity or productivity scoring.</p></div></header><main><section class="panel"><p class="boundary">Nothing runs in the background. The participant label and context are hashed in this browser before submission.</p><div class="form"><label>Private participant label<input id="participant" value="local-reviewer"></label><label>Private context label<input id="context" value="technical review"></label><label>Review milliseconds<input id="reviewMs" type="number" min="0"></label><label>Interruptions<input id="interruptions" type="number" min="0" value="0"></label><label>Accessibility load<select id="accessibility"><option>NOT_RECORDED</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option></select></label><label>Outcome<select id="outcome"><option>COMPLETED</option><option>PARTIAL</option><option>ABANDONED</option><option>UNKNOWN</option></select></label></div><div class="toolbar"><button id="capture">Opt in and archive this observation</button><button id="withdraw" class="danger">Withdraw future capture consent</button></div></section><section class="panel"><h2>Attention records</h2><div id="records" class="cards"></div></section><section class="panel"><pre id="out" class="code">No attention evidence yet.</pre></section></main><script src="../../shared/operations/operations-client.js"></script><script src="app.js"></script></body></html>
