<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AXM Prehub — write, save, load</title>
<!-- AXM Prehub v1: local note authoring with named save/load and autosave resume. -->
<script src="axm-foundation.js"></script>
<style>
  :root{--ink:#14171c;--panel:#191e25;--line:#2a313d;--text:#dce2ea;--muted:#828d9e;--cy:#38d6ec;--gold:#e8b54a}
  *{box-sizing:border-box} body{margin:0;background:var(--ink);color:var(--text);font-family:system-ui,sans-serif;line-height:1.5;padding:18px;max-width:760px;margin:0 auto}
  h1{font-size:20px;margin:0}.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  .status{float:right;font-family:ui-monospace,monospace;font-size:12px;color:var(--cy)}
  .zone{border:1.5px dashed #34404e;border-radius:14px;padding:14px;margin-top:16px}
  .tag{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--cy);text-transform:uppercase}
  textarea{width:100%;min-height:110px;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin-top:10px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
  .panel h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  button{font:inherit;font-size:13px;cursor:pointer;border-radius:9px;padding:8px 13px;border:1px solid var(--line);background:#1f2731;color:var(--text)}
  button.human{border-color:#5a4520;color:#f0c489} button.ai{border-color:#2c5760;color:#a7e6ef}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  input[type=text]{background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;flex:1;min-width:140px}
  ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  li{background:#1f2731;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px}
  .who{font-family:ui-monospace,monospace;font-size:10px;padding:1px 6px;border-radius:20px;margin-right:7px}
  .who.human{color:var(--gold)} .who.ai{color:var(--cy)}
  .hint{font-size:11px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="status" id="status">starting…</div>
<div class="eyebrow">AXM Prehub</div>
<h1 id="title">Prehub — write, save, load</h1>
<section class="zone"><span class="tag">▚ write · save · return</span>
  <textarea id="demo" placeholder="Write anything. It saves locally and survives refresh."></textarea></section>
<section class="panel"><h2>Saves</h2>
  <div class="row"><input type="text" id="slot" value="slotA" /><button class="human" id="save">Save slot</button><button id="load">Load slot</button></div>
  <p class="hint">Autosave keeps your work safe on refresh.</p></section>
<section class="panel"><h2>Wisdom &amp; AI (both optional)</h2>
  <button id="wtoggle">Turn wisdom on</button>
  <div class="row"><input type="text" id="note" placeholder="a lesson worth keeping" /><button class="human" id="fileh">Note (you)</button><button class="ai" id="filea">Lesson (ai)</button></div>
  <ul id="wlist"></ul>
  <div class="row"><button id="ask">Ask AI (optional)</button></div>
  <p class="hint" id="aihint">AI is opt-in. With none connected, this says so and the tool keeps working.</p></section>
<script>
const $ = id => document.getElementById(id);
if (typeof window.AXM === 'undefined') { $('status').textContent = 'missing axm-foundation.js'; throw new Error('bundle not found'); }
function getProject(){ return { note: $('demo').value }; }
function applyProject(d){ if(d) $('demo').value = d.note || ''; }
let W;
(async () => {
  const info = await AXM.init({ id:'prehub', name:'Prehub — write, save, load', version:'v1' });
  AXM.wisdom.on(localStorage.getItem('axm.identity.growth.enabled') !== 'false');
  $('title').textContent = AXM.card().name; $('status').textContent = 'ready · ' + info.storageBackend; W = AXM.wisdom;
  const last = await AXM.store.resume(); if(last){ applyProject(last.data); }
  AXM.store.startAutosave(getProject, 8000);
  $('save').onclick = async () => { await AXM.store.save($('slot').value||'slotA', getProject(), {title:AXM.card().name}); $('status').textContent='saved'; };
  $('load').onclick = async () => { const r = await AXM.store.load($('slot').value||'slotA'); if(r){ applyProject(r.data); $('status').textContent='loaded'; } };
  const renderW = () => { $('wlist').innerHTML = W.all().slice().reverse().map(e=>'<li><span class="who '+(e.author==='human'?'human':'ai')+'">'+e.author+'</span>'+(e.text||'')+'</li>').join(''); };
  W.subscribe(renderW); renderW();
  $('wtoggle').onclick = () => { const on=!W.isOn(); W.on(on); $('wtoggle').textContent = on?'Turn wisdom off':'Turn wisdom on'; };
  $('fileh').onclick = () => { if(!W.isOn())return $('status').textContent='turn wisdom on'; const t=$('note').value.trim(); if(t){W.file(t,{author:'human'});$('note').value='';} };
  $('filea').onclick = () => { if(!W.isOn())return $('status').textContent='turn wisdom on'; const t=$('note').value.trim()||'a lesson'; W.file(t,{author:'ai1'});$('note').value=''; };
  $('ask').onclick = async () => { $('aihint').textContent='asking…'; const r = await AXM.ask('Say hello in five words.'); $('aihint').textContent = r.noAI ? 'No AI connected — the tool works without it.' : ('AI: ' + r.text); };
})();
</script>
</body>
</html>
