<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deterministic Research Foundry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <p class="eyebrow">WORKSHOP RESEARCH · OBSERVE ONLY</p>
        <h1>Deterministic Research Foundry</h1>
        <p id="objective">Loading the latest goal and Workshop evidence…</p>
      </div>
      <div class="truth"><b>NO AUTOMATIC BUILD</b><span>Questions and evidence routes only</span></div>
    </header>

    <section id="status" class="status" aria-live="polite">Loading research report…</section>
    <section id="summary" class="summary" aria-label="Research summary"></section>

    <nav class="tabs" aria-label="Research views">
      <button class="active" data-view="builders">Builder queue</button>
      <button data-view="questions">Questions & tests</button>
      <button data-view="stewards">Steward queue</button>
      <button data-view="truth">Boundaries</button>
    </nav>

    <section id="content" class="content" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
