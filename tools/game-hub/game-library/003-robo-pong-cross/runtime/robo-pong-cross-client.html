<body>
  <header><div class="brand">AXM <span>ROBO PONG CROSS</span></div><div class="connection" id="connection">CONNECTING</div></header>
  <main class="stage">
    <canvas id="game" width="1000" height="1000" aria-label="Four-player Robo Pong Cross arena"></canvas>

      <div class="score-strip"><div class="score-chip" id="scoreP1">P1 · 5</div><div class="score-chip" id="scoreP2">P2 · 5</div><div class="score-chip" id="scoreP3">P3 · 5</div><div class="score-chip" id="scoreP4">P4 · 5</div></div>
      <div class="ability-card" id="controllerAbility"><div class="ability-icon" id="controllerAbilityIcon"><span>◆</span></div><div class="ability-copy"><small>HELD ABILITY</small><strong id="controllerAbilityName">RANDOM SPECIAL</strong><em id="controllerAbilityState">READY · TAP CENTER</em></div></div>

    </section>
    <div class="overlay" id="overlay"><div class="event" id="event">CROSS READY</div><div class="versus" id="versus">four seats · five lives each</div><button class="start" id="start">START FOUR-WAY MATCH</button></div>
    <div class="role" id="role">SPECTATOR SCREEN</div>
  </main>
  <nav class="controls" id="controls" hidden>
    <button class="move" id="left" aria-label="Move negative direction">◀</button>
    <button class="move" id="right" aria-label="Move positive direction">▶</button>
    <button class="power" id="power"><span id="powerName">RANDOM SPECIAL</span><small id="powerState">READY</small></button>
  </nav>

  var state=null,lastPacket=0,input={left:false,right:false},fallbackTimer=null,lite=player!=='screen',lastRender=0,previousControllerLives=null,previousPowerActive=false;
  if(lite){document.body.classList.add('controller');controls.hidden=false;controllerPanel.hidden=false;canvas.dataset.renderMode='controller-only';setupControllerCache();}
  function setupControllerCache(){
    var deferredInstall=null,swUrl=(base||'')+'/controller-sw.js',swScope=(base||'')+'/';
    addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;installController.hidden=false;});
    installController.onclick=function(){if(!deferredInstall)return;deferredInstall.prompt();deferredInstall.userChoice.finally(function(){deferredInstall=null;installController.hidden=true;});};

  }

  stage.addEventListener('pointerdown',function(e){if(!lite||e.target.closest('button'))return;e.preventDefault();activatePower();});

    controllerAbility.style.borderColor=color;controllerAbility.style.boxShadow='inset 0 1px rgba(255,255,255,.08),0 0 28px '+color+'33';controllerAbilityIcon.style.color=color;controllerAbilityName.style.color=color;controllerAbilityIcon.firstElementChild.textContent=powerIcon(power&&power.kind);controllerAbilityName.textContent=power&&power.active?(power.activeLabel||power.label):(power&&power.label||'RANDOM SPECIAL');controllerAbilityState.textContent=!mine.alive?'ELIMINATED':state.phase==='gameover'?'MATCH OVER':state.phase!=='running'?'WAITING FOR START':power&&power.active?'ACTIVE':seconds>0?'RECHARGING · '+seconds+'s':'READY · TAP CENTER';
  }

    role.textContent=player==='screen'?'SPECTATOR SCREEN':'YOU ARE '+player.toUpperCase()+' · '+state.players[player].name+' · '+state.players[player].side.toUpperCase();
    versus.textContent=Object.keys(state.players).map(function(id){return state.players[id].name+' '+state.lives[id];}).join(' · ')+' · '+alive+' ALIVE';

  }

  function drawPaddle(p,color,alive,active){if(!alive)return;ctx.save();ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=lite?(active?12:7):(active?30:19);ctx.beginPath();if(p.horizontal)ctx.roundRect(p.x-p.length/2,p.y-p.thickness/2,p.length,p.thickness,13);else ctx.roundRect(p.x-p.thickness/2,p.y-p.length/2,p.thickness,p.length,13);ctx.fill();ctx.fillStyle='#fff';ctx.globalAlpha=.75;if(p.horizontal)ctx.fillRect(p.x-28,p.y-4,56,8);else ctx.fillRect(p.x-4,p.y-28,8,56);ctx.restore();}
  function drawBall(b,index){var fills=['#fff','#fff3a6','#ffd0f3'],glows=['#35e6ff','#ffc85a','#ff4fc8'],strokes=['#ff4fc8','#9cff63','#76a9ff'];ctx.save();ctx.fillStyle=fills[index]||fills[0];ctx.shadowColor=glows[index]||glows[0];ctx.shadowBlur=lite?10:30;ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle=strokes[index]||strokes[0];ctx.lineWidth=4;ctx.stroke();ctx.restore();}
  function powerIcon(kind){return({shield:'⬡',warp:'↯',slow:'◷',jammer:'⊘',curve:'↝',overdrive:'»'})[kind]||'◆';}
  function powerStatus(id){var p=state.power[id];if(!state.players[id].alive)return'OUT';if(p.active)return'ACTIVE';return p.readyIn>0?Math.ceil(p.readyIn/1000)+'s':'READY';}
  function drawSkillCard(id,x,y){var playerData=state.players[id],power=state.power[id],alive=playerData.alive,color=alive?power.color:'#536174';ctx.save();ctx.fillStyle='rgba(4,9,18,.88)';ctx.strokeStyle=color;ctx.lineWidth=2;ctx.shadowColor=color;ctx.shadowBlur=12;ctx.beginPath();ctx.roundRect(x,y,220,62,13);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x+31,y+31,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#07101b';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 23px ui-monospace,monospace';ctx.fillText(powerIcon(power.kind),x+31,y+31);ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillStyle=alive?playerData.color:'#728096';ctx.font='900 11px ui-monospace,monospace';ctx.fillText(id.toUpperCase()+' · '+playerData.name.toUpperCase(),x+58,y+22);ctx.fillStyle=color;ctx.font='900 14px ui-monospace,monospace';ctx.fillText(power.active?(power.activeLabel||power.label):power.label,x+58,y+44);ctx.textAlign='right';ctx.font='900 10px ui-monospace,monospace';ctx.fillText(powerStatus(id),x+210,y+22);ctx.restore();}
  function drawHud(){if(!state)return;ctx.save();ctx.font='900 18px ui-monospace,monospace';ctx.textAlign='center';ctx.fillStyle=state.players.p2.alive?state.players.p2.color:'#536174';ctx.fillText(state.players.p2.name+' · '+state.lives.p2+' ♥',500,45);ctx.fillStyle=state.players.p1.alive?state.players.p1.color:'#536174';ctx.fillText(state.players.p1.name+' · '+state.lives.p1+' ♥',500,974);ctx.save();ctx.translate(43,500);ctx.rotate(-Math.PI/2);ctx.fillStyle=state.players.p3.alive?state.players.p3.color:'#536174';ctx.fillText(state.players.p3.name+' · '+state.lives.p3+' ♥',0,0);ctx.restore();ctx.save();ctx.translate(957,500);ctx.rotate(Math.PI/2);ctx.fillStyle=state.players.p4.alive?state.players.p4.color:'#536174';ctx.fillText(state.players.p4.name+' · '+state.lives.p4+' ♥',0,0);ctx.restore();ctx.restore();if(!lite){drawSkillCard('p2',78,82);drawSkillCard('p4',702,82);drawSkillCard('p3',78,856);drawSkillCard('p1',702,856);}if(Date.now()-state.eventAt<1250&&state.phase==='running'&&!state.serveIn){ctx.save();ctx.textAlign='center';ctx.font='900 26px ui-monospace,monospace';ctx.fillStyle='rgba(255,255,255,'+(1-(Date.now()-state.eventAt)/1250)+')';ctx.fillText(state.event,500,690);ctx.restore();}}
  function render(timestamp){if(lite&&timestamp-lastRender<33){requestAnimationFrame(render);return;}lastRender=timestamp||0;drawArena();drawDiamond();if(state){['p1','p2','p3','p4'].forEach(function(id){drawPaddle(state.paddles[id],state.players[id].color,state.players[id].alive,state.power[id].active);});(state.balls||[state.ball]).forEach(drawBall);drawHud();}else{ctx.save();ctx.textAlign='center';ctx.fillStyle='#8ba0b8';ctx.font='800 22px ui-monospace,monospace';ctx.fillText('CONNECTING TO CROSS ARENA',500,700);ctx.restore();}requestAnimationFrame(render);}
  connect();if(!lite)render();
})();
</script>
