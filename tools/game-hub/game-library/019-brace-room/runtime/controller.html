<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Brace Room — Controller</title>
<style>
  :root { color-scheme: dark; }
  * {
    box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none;
    -webkit-touch-callout: none; touch-action: none;
  }
  html, body {
    margin: 0; height: 100%; background: #05080d; color: #eaf2ff;
    font-family: system-ui, sans-serif; overflow: hidden;
    display: flex; flex-direction: column;
    overscroll-behavior: none; touch-action: none;
  }
  #status { text-align: center; padding: 8px; font-size: 0.85rem; color: #93a4c2; }
  #status.warn { color: #f5c542; }
  #layout { flex: 1; display: flex; align-items: stretch; justify-content: space-between; padding: 16px; gap: 16px; }
  /* Analog joystick: a fixed base circle plus a knob that follows the
     finger, clamped to the base radius. DESIGN_BIBLE.md originally called
     for "touch joystick + one large ACTION button" — the first build
     shipped a 4-button d-pad instead as a known, flagged shortcut (see
     KNOWN_LIMITS.md). game-core.js's applyMovement() already normalizes
     input magnitude only when it exceeds 1, so partial deflection was
     always going to give proportionally slower movement once something
     actually sent a fractional moveX/moveY — this UI is the only piece
     that was missing. */
  #joystick {
    align-self: center;
    width: 168px; height: 168px; border-radius: 50%;
    background: #0d1420; border: 2px solid #2c3c56;
    position: relative; touch-action: none;
  }
  #joy-knob {
    width: 68px; height: 68px; border-radius: 50%;
    background: #131c2c; border: 2px solid #4f8bff;
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    transition: background-color 0.1s, border-color 0.1s;
  }
  #joystick.active #joy-knob { background: #4f8bff; border-color: #7cb3ff; }
  #action {
    align-self: center;
    width: 140px; height: 140px; border-radius: 50%;
    background: #1c2738; border: 3px solid #7cff6b; color: #7cff6b;
    font-size: 1.1rem; font-weight: 800;
  }
  #action:active, #action.pressed { background: #7cff6b; color: #051019; }
</style>
</head>
<body>
  <div id="status">Connecting…</div>
  <div id="layout">
    <div id="joystick"><div id="joy-knob"></div></div>
    <button id="action">ACTION</button>
  </div>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var player = params.get('player') || 'p1';
  var statusEl = document.getElementById('status');
  statusEl.textContent = 'Controlling seat ' + player.toUpperCase() + ' — keep this tab open.';

  // Belt-and-suspenders against page scroll/pinch-zoom on real phones: CSS
  // touch-action: none plus e.preventDefault() on pointerdown covers modern
  // browsers, but a stray touchmove reaching the page on an older/quirkier
  // mobile Safari could still trigger a rubber-band scroll mid-hold, which
  // would silently drop that seat's input for a frame during exactly the
  // kind of fault (hold, mash) where a dropped frame matters most. This is
  // untested on a real device (physical_phone_qa is still pending in the
  // manifest) but costs nothing to have in place ahead of that test.
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  // Screen-sleep during a held fault is a real failure mode for a
  // phone-as-controller: the OS dims/locks the screen mid-session, the tab
  // keeps running but the player can no longer touch anything until they
  // wake the phone and tap back in, likely losing the fault they were
  // holding. The Wake Lock API isn't supported everywhere (notably older
  // iOS Safari), so this is a progressive enhancement, not a guarantee —
  // wrapped so its absence or failure never breaks input.
  var wakeLock = null;
  function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
    }).catch(function () { /* denied or unsupported — silently continue without it */ });
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', function () {
    // A wake lock is released automatically when the tab backgrounds; it
    // has to be re-requested once the player returns to this tab.
    if (document.visibilityState === 'visible') requestWakeLock();
  });

  function vibrate(ms) {
    if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* unsupported, ignore */ } }
  }

  var held = { action: false };
  var actionWasHeld = false;
  var joyVec = { x: 0, y: 0 };

  // Analog joystick: track one pointer from down to up, compute an offset
  // from the base's own center (not the pointerdown point) so a thumb that
  // lands slightly off-center still reads a correct direction, clamp that
  // offset to the base's radius, and convert it to a -1..1 vector. A small
  // dead zone near center absorbs finger jitter when the player means to
  // stand still.
  var joyBase = document.getElementById('joystick');
  var joyKnob = document.getElementById('joy-knob');
  var joyPointerId = null;
  var joyDeadZone = 6;

  function setJoyVisual(dx, dy) {
    joyKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
  }
  function resetJoy() {
    joyPointerId = null;
    joyVec.x = 0; joyVec.y = 0;
    joyBase.classList.remove('active');
    setJoyVisual(0, 0);
  }
  function updateJoyFromPointer(e) {
    var rect = joyBase.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = e.clientX - cx;
    var dy = e.clientY - cy;
    var maxR = rect.width / 2 - 34; // leave the knob's own radius inside the base
    var dist = Math.hypot(dx, dy);
    if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; dist = maxR; }
    setJoyVisual(dx, dy);
    if (dist < joyDeadZone) { joyVec.x = 0; joyVec.y = 0; return; }
    joyVec.x = dx / maxR;
    joyVec.y = dy / maxR;
  }
  joyBase.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    joyPointerId = e.pointerId;
    joyBase.setPointerCapture(e.pointerId);
    joyBase.classList.add('active');
    updateJoyFromPointer(e);
  });
  joyBase.addEventListener('pointermove', function (e) {
    if (e.pointerId !== joyPointerId) return;
    e.preventDefault();
    updateJoyFromPointer(e);
  });
  joyBase.addEventListener('pointerup', function (e) { if (e.pointerId === joyPointerId) resetJoy(); });
  joyBase.addEventListener('pointercancel', function (e) { if (e.pointerId === joyPointerId) resetJoy(); });
  joyBase.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function bindHold(id, key, hapticMs) {
    var el = document.getElementById(id);
    function setHeld(v) {
      held[key] = v;
      el.classList.toggle('pressed', v);
      if (v && hapticMs) vibrate(hapticMs);
    }
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); el.setPointerCapture(e.pointerId); setHeld(true); });
    el.addEventListener('pointerup', function (e) { e.preventDefault(); setHeld(false); });
    el.addEventListener('pointercancel', function () { setHeld(false); });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  // A short tap buzz on the action button only — it's the button that
  // actually resolves faults, so it's the one press worth confirming by
  // feel, not just by sight, especially for a mash verb where a player's
  // thumb may be moving too fast to watch the screen closely.
  bindHold('action', 'action', 15);

  function send() {
    var actionEdge = held.action && !actionWasHeld;
    actionWasHeld = held.action;
    var body = {
      player: player,
      moveX: joyVec.x,
      moveY: joyVec.y,
      action: held.action,
      actionEdge: actionEdge
    };
    fetch('/api/input', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function () {
      statusEl.className = '';
      statusEl.textContent = 'Controlling seat ' + player.toUpperCase() + ' — keep this tab open.';
    }).catch(function () {
      statusEl.className = 'warn';
      statusEl.textContent = 'Lost the connection to Brace Room — check the wifi.';
    });
  }

  // 20Hz is plenty for an analog stick + one button; keeps battery/network light.
  setInterval(send, 50);
  send();
})();
</script>
</body>
</html>
