<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AXM District Party · Persistent Party Screen</title>
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/party-screen/party-screen.css">
</head>
<body>
  <main id="receiver" class="receiver">
    <section id="waiting" class="waiting panel">
      <div class="screen-sigil"><span>A</span></div>
      <div class="eyebrow">AXM District Party</div>
      <h1 id="party-title">Party A Screen</h1>
      <p>Waiting for a local session…</p>
      <div class="room-line">Room: <strong>AXM1</strong></div>
      <span id="poll-status" class="status-pill">Local receiver ready</span>
      <small>This display occupies no player seat and sends no player input.</small>
    </section>
    <iframe id="game-frame" class="game-frame hidden" title="AXM District Party shared city screen" sandbox="allow-scripts allow-same-origin"></iframe>
  </main>
  <script src="/party-screen/party-screen.js"></script>
</body>
</html>
