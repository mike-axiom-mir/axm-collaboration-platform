<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1c1722">
  <title>Hearthgate Phone Controller</title>
  <style>
    :root { color-scheme: dark; --ink:#f6dfad; --muted:#b9a681; --panel:#2b2230; --line:#6d594f; --north:#e9a85e; --south:#85c29a; --seat:var(--north); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; touch-action:none; background:#17121b; color:var(--ink); font-family:ui-monospace,Consolas,monospace; }
    body { padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    button { color:inherit; font:inherit; border:0; user-select:none; -webkit-user-select:none; touch-action:none; }
    .shell { position:relative; width:100%; height:100%; min-height:260px; overflow:hidden; background:radial-gradient(circle at 50% 35%,#3d2c35 0 13%,transparent 44%),linear-gradient(180deg,#241b27,#17131c); }
    .shell::before { content:""; position:absolute; inset:0; opacity:.14; pointer-events:none; background:repeating-linear-gradient(0deg,transparent 0 5px,#fff 6px 7px),repeating-linear-gradient(90deg,transparent 0 9px,#000 10px 11px); }
    header { position:absolute; z-index:3; top:8px; left:50%; width:min(38vw,330px); transform:translateX(-50%); text-align:center; pointer-events:none; }
    .seat { display:inline-flex; gap:7px; align-items:center; padding:5px 10px; color:#211820; background:var(--seat); border:3px solid #151018; box-shadow:0 3px 0 #0e0a10; font-size:clamp(11px,1.8vw,16px); font-weight:1000; letter-spacing:.08em; }
    .seat i { width:7px; height:7px; background:#201721; box-shadow:0 0 0 2px #f7ddb1; }
    .connection { margin-top:7px; color:var(--muted); font-size:clamp(8px,1.2vw,12px); letter-spacing:.08em; }
    .connection.live { color:#a9e3ae; }
    .connection.lost { color:#ff927e; }
    .stick-zone { position:absolute; z-index:2; bottom:max(16px,env(safe-area-inset-bottom)); width:min(34vh,32vw); height:min(34vh,32vw); min-width:150px; min-height:150px; max-width:230px; max-height:230px; border-radius:50%; }
    .stick-zone.move { left:max(18px,env(safe-area-inset-left)); }
    .stick-zone.aim { right:max(18px,env(safe-area-inset-right)); }
    .stick-base { position:absolute; inset:8%; border-radius:50%; border:3px solid #7c6559; background:radial-gradient(circle,#302734 0 27%,#241d29 28% 48%,#3b2d35 49% 52%,#211a25 53%); box-shadow:0 7px 0 #100c13,0 0 0 5px #17121a; }
    .stick-knob { position:absolute; width:42%; height:42%; left:29%; top:29%; border-radius:50%; border:3px solid #aa8d6f; background:radial-gradient(circle at 35% 30%,#766055,#3d313c 58%,#251e29); box-shadow:0 5px 0 #17121b; transform:translate(0,0); }
    .stick-label { position:absolute; inset:auto 0 -1px; text-align:center; font-size:clamp(10px,1.6vw,15px); font-weight:1000; letter-spacing:.16em; color:var(--seat); text-shadow:2px 2px #18121a; }
    .stick-zone.active .stick-base { border-color:var(--seat); box-shadow:0 7px 0 #100c13,0 0 0 5px #17121a,0 0 18px color-mix(in srgb,var(--seat) 45%,transparent); }
    .center { position:absolute; z-index:2; left:50%; top:50%; width:min(31vw,270px); transform:translate(-50%,-42%); display:grid; grid-template-columns:repeat(4,1fr); gap:8px; align-items:center; }
    .action { min-height:54px; padding:5px 3px; border:3px solid #17121b; background:#493943; box-shadow:0 4px 0 #100c13,inset 0 0 0 2px #71594f; border-radius:8px; font-size:clamp(8px,1.25vw,12px); font-weight:1000; letter-spacing:.04em; line-height:1.05; }
    .action b { display:block; margin-bottom:3px; color:#fff0c8; font-size:clamp(13px,2.1vw,20px); }
    .action.fire { grid-column:2/4; grid-row:1/3; min-height:116px; border-radius:50%; background:#9b514b; box-shadow:0 6px 0 #3b2023,inset 0 0 0 4px #dc7863; font-size:clamp(10px,1.4vw,14px); }
    .action.fire b { font-size:clamp(22px,4vw,38px); }
    .action.lt { grid-column:1; grid-row:1; }
    .action.x { grid-column:1; grid-row:2; background:#3d6383; }
    .action.y { grid-column:4; grid-row:1; background:#9b864a; }
    .action.rb { grid-column:4; grid-row:2; background:#4e725d; }
    .action.lb { grid-column:1/3; grid-row:3; }
    .action.menu { grid-column:3; grid-row:3; }
    .action.back { grid-column:4; grid-row:3; }
    .action.pressed { transform:translateY(3px); box-shadow:0 1px 0 #100c13,inset 0 0 0 2px var(--seat); filter:brightness(1.2); }
    .hint { position:absolute; z-index:1; left:50%; bottom:7px; transform:translateX(-50%); width:38vw; text-align:center; color:#8f7e70; font-size:clamp(7px,1vw,10px); letter-spacing:.04em; }
    .rotate { display:none; position:fixed; z-index:10; inset:0; padding:28px; place-items:center; text-align:center; background:#17121b; color:var(--ink); font-weight:1000; letter-spacing:.08em; }
    .rotate span { max-width:280px; padding:24px; border:3px solid var(--seat); background:#2b2230; }
    @media (orientation:portrait) { .rotate { display:grid; } }
    @media (max-height:330px) {
      header { top:4px; }
      .connection { margin-top:3px; }
      .center { top:53%; gap:5px; width:min(31vw,240px); }
      .action { min-height:45px; }
      .action.fire { min-height:96px; }
      .stick-zone { min-width:132px; min-height:132px; }
      .hint { display:none; }
    }
  </style>
</head>
<body>
  <main class="shell" id="controller">
    <header>
      <div class="seat" id="seat"><i></i><span>NORTH &middot; P1</span></div>
      <div class="connection" id="connection">CONNECTING TO HEARTHGATE...</div>
    </header>

    <section class="stick-zone move" id="moveStick" aria-label="Move joystick">
      <div class="stick-base"></div><div class="stick-knob"></div><div class="stick-label">MOVE</div>
    </section>

    <section class="center" aria-label="Gate actions">
      <button class="action lt" data-edge="volley"><b>LT</b>VOLLEY</button>
      <button class="action x" data-edge="upgrade"><b>X</b>UPGRADE</button>
      <button class="action fire" id="fireButton"><b>A / RT</b>START / FIRE</button>
      <button class="action y" data-edge="repair"><b>Y</b>REPAIR</button>
      <button class="action rb" data-edge="build"><b>RB</b>HOLD WHEEL</button>
      <button class="action lb" data-edge="fortify"><b>LB</b>GATE</button>
      <button class="action menu" data-edge="pause"><b>MENU</b>PAUSE</button>
      <button class="action back" data-edge="back"><b>B</b>BACK</button>
    </section>

    <section class="stick-zone aim" id="aimStick" aria-label="Aim joystick">
      <div class="stick-base"></div><div class="stick-knob"></div><div class="stick-label">AIM &middot; RELEASE FIRE</div>
    </section>
    <div class="hint">TITLE: A START &middot; X SOLO &middot; Y CO-OP &middot; P1 NORTH &middot; P2 SOUTH</div>
  </main>
  <aside class="rotate"><span>ROTATE PHONE SIDEWAYS<br><br>HEARTHGATE USES A TWO-STICK LANDSCAPE CONTROLLER</span></aside>

  <script>
    (() => {
      'use strict';
      const params = new URLSearchParams(location.search);
      const player = params.get('player') === 'p2' ? 'p2' : 'p1';
      const side = player === 'p2' ? 'SOUTH' : 'NORTH';
      const seatNumber = player === 'p2' ? 2 : 1;
      const root = document.documentElement;
      const seat = document.querySelector('#seat span');
      const connection = document.querySelector('#connection');
      const held = { fire:false, build:false };
      const vector = { moveX:0, moveY:0, aimX:0, aimY:0 };
      const fireAim = { x:0, y:0 };
      const edgeQueue = { fire:0, volley:0, upgrade:0, repair:0, fortify:0, build:0, pause:0, back:0 };
      let sequence = 0;
      let sending = false;
      let failures = 0;
      let aimCommitted = false;
      let wakeLock = null;

      root.style.setProperty('--seat', player === 'p2' ? 'var(--south)' : 'var(--north)');
      seat.textContent = `${side} · P${seatNumber}`;

      function buzz(pattern) { try { navigator.vibrate?.(pattern); } catch (_) {} }
      function queueEdge(name) { edgeQueue[name] += 1; buzz(18); }
      function queueFire(aim) {
        const source = aim || { x:vector.aimX, y:vector.aimY };
        fireAim.x = Number(source.x) || 0;
        fireAim.y = Number(source.y) || 0;
        queueEdge('fire');
      }
      async function keepAwake() {
        try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
      }
      document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
      document.addEventListener('pointerdown', keepAwake, { once:true });

      function bindStick(element, prefix, onRelease) {
        const knob = element.querySelector('.stick-knob');
        let pointerId = null;
        const update = event => {
          const rect = element.getBoundingClientRect();
          const dx = (event.clientX - (rect.left + rect.width / 2)) / (rect.width * .32);
          const dy = (event.clientY - (rect.top + rect.height / 2)) / (rect.height * .32);
          const length = Math.hypot(dx, dy);
          const scale = length > 1 ? 1 / length : 1;
          const x = dx * scale;
          const y = dy * scale;
          vector[`${prefix}X`] = Math.abs(x) < .08 ? 0 : x;
          vector[`${prefix}Y`] = Math.abs(y) < .08 ? 0 : y;
          knob.style.transform = `translate(${x * 67}%,${y * 67}%)`;
          element.classList.add('active');
          if (prefix === 'aim' && Math.hypot(x, y) > .55) aimCommitted = true;
        };
        const release = event => {
          if (pointerId === null || event && event.pointerId !== pointerId) return;
          const released = { x:vector[`${prefix}X`], y:vector[`${prefix}Y`] };
          const releasedPointer = pointerId;
          pointerId = null;
          try { element.releasePointerCapture(releasedPointer); } catch (_) {}
          vector[`${prefix}X`] = 0;
          vector[`${prefix}Y`] = 0;
          knob.style.transform = 'translate(0,0)';
          element.classList.remove('active');
          if (onRelease) onRelease(released);
        };
        element.addEventListener('pointerdown', event => {
          if (pointerId !== null) return;
          pointerId = event.pointerId;
          element.setPointerCapture(pointerId);
          update(event);
          buzz(8);
        });
        element.addEventListener('pointermove', event => { if (event.pointerId === pointerId) update(event); });
        element.addEventListener('pointerup', release);
        element.addEventListener('pointercancel', release);
        element.addEventListener('lostpointercapture', event => { if (event.pointerId === pointerId) release(event); });
      }

      bindStick(document.querySelector('#moveStick'), 'move');
      bindStick(document.querySelector('#aimStick'), 'aim', released => {
        if (aimCommitted) queueFire(released);
        aimCommitted = false;
      });

      const fireButton = document.querySelector('#fireButton');
      const fireOff = () => { held.fire = false; fireButton.classList.remove('pressed'); };
      fireButton.addEventListener('pointerdown', event => {
        held.fire = true;
        queueFire();
        fireButton.classList.add('pressed');
        fireButton.setPointerCapture(event.pointerId);
        buzz(12);
      });
      ['pointerup','pointercancel','lostpointercapture'].forEach(type => fireButton.addEventListener(type, fireOff));

      document.querySelectorAll('[data-edge]').forEach(button => {
        const release = () => {
          if (button.dataset.edge === 'build') held.build = false;
          button.classList.remove('pressed');
        };
        button.addEventListener('pointerdown', event => {
          if (button.dataset.edge === 'build') held.build = true;
          button.classList.add('pressed');
          button.setPointerCapture(event.pointerId);
          queueEdge(button.dataset.edge);
        });
        ['pointerup','pointercancel','lostpointercapture'].forEach(type => button.addEventListener(type, release));
      });

      async function sendInput() {
        if (sending || document.hidden) return;
        sending = true;
        const sentEdges = {};
        Object.keys(edgeQueue).forEach(key => { sentEdges[key] = edgeQueue[key] > 0; });
        try {
          const response = await fetch('/api/input', {
            method:'POST',
            headers:{ 'content-type':'application/json' },
            body:JSON.stringify({ protocol:'axm-semantic-input-v1', player, sequence:++sequence, ...vector, fire:held.fire, buildHeld:held.build, fireAimX:fireAim.x, fireAimY:fireAim.y, edges:sentEdges })
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          Object.keys(sentEdges).forEach(key => { if (sentEdges[key] && edgeQueue[key] > 0) edgeQueue[key] -= 1; });
          if (sentEdges.fire && edgeQueue.fire === 0) fireAim.x = fireAim.y = 0;
          failures = 0;
          connection.textContent = `${side} LINK LIVE · P${seatNumber}`;
          connection.className = 'connection live';
        } catch (_) {
          failures += 1;
          connection.textContent = failures > 4 ? 'LINK LOST · CHECK SAME WI-FI' : 'CONNECTING TO HEARTHGATE...';
          connection.className = failures > 4 ? 'connection lost' : 'connection';
        } finally { sending = false; }
      }

      window.addEventListener('blur', () => {
        held.fire = false;
        held.build = false;
        vector.moveX = vector.moveY = vector.aimX = vector.aimY = 0;
        fireAim.x = fireAim.y = 0;
      });
      window.addEventListener('contextmenu', event => event.preventDefault());
      setInterval(sendInput, 50);
      sendInput();
    })();
  </script>
</body>
</html>
