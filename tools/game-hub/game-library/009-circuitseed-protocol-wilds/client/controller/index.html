<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Circuitseed Controller</title><link rel="stylesheet" href="/controller/controller.css"></head>
<body>
  <header><div><strong>CIRCUITSEED</strong><small>LOCAL FIELD CONTROLLER</small></div><span id="connection">PAIRING</span></header>
  <main>
    <section class="seat-card"><div><small id="seatLabel">SEAT</small><h1 id="playerName">Pathfinder</h1></div><div class="vital"><i id="vitalBar"></i><span id="vitalText">—</span></div><p id="missionText">Connect to a local host session.</p></section>
    <section class="control-field">
      <div id="stickZone" class="stick-zone" aria-label="Move stick"><div id="stickBase" class="stick-base"><i id="stickKnob"></i></div><span>MOVE</span></div>
      <div class="action-grid">
        <button data-pulse="scan"><b>◉</b>SCAN</button>
        <button data-pulse="connect"><b>⌁</b>CONNECT</button>
        <button data-pulse="assist"><b>∞</b>ASSIST</button>
        <button data-pulse="recover"><b>✦</b>RECOVER</button>
        <button data-pulse="deploy"><b>◇</b>DEPLOY</button>
        <button data-pulse="return"><b>⌂</b>RETURN</button>
        <button data-pulse="build"><b>⬡</b>BUILD</button>
        <button data-pulse="interact" class="act"><b>↟</b>ACT</button>
      </div>
    </section>
    <section id="tactics" class="tactics hidden"><p>TACTICAL ACTION</p><div id="tacticalButtons"></div></section>
  </main>
  <footer><span>INTENTIONS ONLY · HOST AUTHORITATIVE</span><span id="fieldMeta">ARCHIVE — · REQUESTS —</span><span id="sequence">SEQ —</span></footer>
  <script src="/controller/controller.js"></script>
</body></html>
