<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AXM Copy Composer Hand</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <a class="back" href="../../hub/index.html">← HUB</a>
    <header><span>DETERMINISTIC CREATION HAND · TEST</span><h1>Copy Composer</h1><p>Short candidate copy with visible recipe, replay evidence, and no silent authority.</p></header>
    <section class="composer">
      <label for="prompt">What should the hand make?</label>
      <textarea id="prompt" rows="4">make an inspiring quote for axm</textarea>
      <button id="compose" type="button">COMPOSE CANDIDATE</button>
    </section>
    <section id="result" class="result hidden" aria-live="polite">
      <span>CANDIDATE · NOT CANON</span>
      <blockquote id="copy"></blockquote>
      <button id="copyButton" type="button">COPY TEXT</button>
      <div id="alternatives"></div>
      <pre id="receipt"></pre>
    </section>
  </main>
  <script src="copy-composer-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
