<!doctype html>
<html lang="en">
  <head><title>Escaping &amp; inertness</title></head>
  <body>
    <main>
      <h1>&lt;script&gt;must remain text&lt;/script&gt;</h1>
      <p>Quotes: &quot;double&quot; and 'single'. Angle text: &lt;img onerror=alert(1)&gt;.</p>
      <a href="javascript:alert(1)" onclick="alert(2)">Unsafe-looking target stays inert</a>
      <img src="https://invalid.example/tracker.png" alt="Remote image stays a placeholder">
      <form action="https://invalid.example/submit"><button>Do not submit</button></form>
    </main>
  </body>
</html>
