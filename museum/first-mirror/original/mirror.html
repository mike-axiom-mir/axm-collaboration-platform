
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Mirror</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a12;
    color: #c8c8d8;
    font-family: 'Georgia', serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Ambient background glow */
  body::before {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(80, 60, 120, 0.15) 0%, transparent 70%);
    pointer-events: none;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  }

  /* Mirror orb */
  .mirror-orb {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 1px solid rgba(180, 160, 220, 0.3);
    background: radial-gradient(circle at 35% 35%, rgba(140, 110, 200, 0.2), rgba(60, 40, 100, 0.1));
    box-shadow:
      0 0 40px rgba(120, 80, 200, 0.15),
      0 0 80px rgba(80, 60, 160, 0.08),
      inset 0 0 30px rgba(180, 150, 255, 0.05);
    margin-bottom: 48px;
    animation: orbPulse 6s ease-in-out infinite;
    cursor: default;
  }

  @keyframes orbPulse {
    0%, 100% { box-shadow: 0 0 40px rgba(120,80,200,0.15), 0 0 80px rgba(80,60,160,0.08), inset 0 0 30px rgba(180,150,255,0.05); }
    50% { box-shadow: 0 0 60px rgba(120,80,200,0.25), 0 0 120px rgba(80,60,160,0.15), inset 0 0 40px rgba(180,150,255,0.1); }
  }

  /* Screens */
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 580px;
    padding: 0 24px;
  }
  .screen.active { display: flex; }

  /* Welcome screen */
  .welcome-title {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(180, 160, 220, 0.5);
    margin-bottom: 32px;
  }

  .welcome-question {
    font-size: 22px;
    color: rgba(210, 200, 230, 0.85);
    text-align: center;
    line-height: 1.7;
    margin-bottom: 48px;
    font-style: italic;
  }

  .begin-btn {
    background: transparent;
    border: 1px solid rgba(150, 120, 200, 0.3);
    color: rgba(180, 160, 220, 0.6);
    padding: 12px 36px;
    border-radius: 40px;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s ease;
    font-family: 'Georgia', serif;
  }

  .begin-btn:hover {
    border-color: rgba(150, 120, 200, 0.7);
    color: rgba(210, 180, 255, 0.9);
    box-shadow: 0 0 20px rgba(120, 80, 200, 0.15);
  }

  /* Chat screen */
  .chat-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    height: 70vh;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 8px 4px 24px;
    scrollbar-width: none;
  }
  .messages::-webkit-scrollbar { display: none; }

  .message {
    max-width: 88%;
    line-height: 1.8;
    font-size: 15px;
    animation: fadeUp 0.5s ease forwards;
    opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.mirror {
    align-self: flex-start;
    color: rgba(200, 185, 230, 0.85);
    font-style: italic;
    padding-left: 16px;
    border-left: 1px solid rgba(150, 120, 200, 0.25);
  }

  .message.user {
    align-self: flex-end;
    color: rgba(220, 215, 235, 0.7);
    text-align: right;
    font-size: 14px;
  }

  .typing-indicator {
    display: none;
    align-self: flex-start;
    padding-left: 16px;
    gap: 6px;
    align-items: center;
  }
  .typing-indicator.active { display: flex; }
  .typing-indicator span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(150, 120, 200, 0.4);
    animation: typingDot 1.2s ease-in-out infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingDot {
    0%, 100% { opacity: 0.3; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
  }

  /* Input area */
  .input-area {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    padding-top: 20px;
    border-top: 1px solid rgba(150, 120, 200, 0.1);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: rgba(220, 210, 235, 0.8);
    font-family: 'Georgia', serif;
    font-size: 14px;
    line-height: 1.7;
    resize: none;
    min-height: 24px;
    max-height: 120px;
    overflow-y: auto;
    scrollbar-width: none;
  }
  textarea::placeholder { color: rgba(150, 130, 180, 0.3); }

  .send-btn {
    background: transparent;
    border: 1px solid rgba(150, 120, 200, 0.25);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    flex-shrink: 0;
    color: rgba(180, 150, 220, 0.5);
  }
  .send-btn:hover {
    border-color: rgba(150, 120, 200, 0.6);
    color: rgba(200, 170, 255, 0.9);
    box-shadow: 0 0 12px rgba(120, 80, 200, 0.2);
  }

  .mirror-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(150, 120, 200, 0.3);
    margin-bottom: 28px;
    text-align: center;
  }

  /* Reflection panel */
  .reflection {
    display: none;
    margin-top: 16px;
    padding: 16px 20px;
    border: 1px solid rgba(150, 120, 200, 0.15);
    border-radius: 12px;
    background: rgba(80, 60, 120, 0.05);
    font-size: 13px;
    color: rgba(180, 160, 220, 0.6);
    font-style: italic;
    line-height: 1.8;
    text-align: center;
    animation: fadeUp 0.6s ease forwards;
  }
  .reflection.visible { display: block; }
</style>
</head>
<body>

<!-- Welcome Screen -->
<div class="screen active" id="welcomeScreen">
  <div class="mirror-orb"></div>
  <p class="welcome-title">The Mirror</p>
  <p class="welcome-question">"What's actually going on<br>with you right now?"</p>
  <button class="begin-btn" onclick="beginSession()">Enter</button>
</div>

<!-- Chat Screen -->
<div class="screen" id="chatScreen">
  <p class="mirror-label">The Mirror</p>
  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="message mirror" style="opacity:1;">
        There's no right way to begin. Just say what's actually there — not what sounds good. Not what makes sense. Just what's real right now.
      </div>
    </div>
    <div class="typing-indicator" id="typingIndicator">
      <span></span><span></span><span></span>
    </div>
    <div class="reflection" id="reflection"></div>
    <div class="input-area">
      <textarea
        id="userInput"
        placeholder="Just say what's there..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" onclick="sendMessage()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  const reflections = [
    (msg) => `I heard something underneath that. You said "${msg.split(' ').slice(0,5).join(' ')}..." — but what seems to be sitting behind it is something you haven't fully named yet. What is it really?`,
    () => `There's weight in what you just said. Not the words exactly — the thing the words are carrying. Where does that come from?`,
    () => `You didn't have to say that out loud. The fact that you did means some part of you needed it heard. I heard it.`,
    () => `What would change — even slightly — if you stopped carrying that alone?`,
    () => `I notice you described that from the outside — like you were watching it happen to someone else. What does it feel like from the inside?`,
    () => `That's not a small thing. Most people would dress it up differently. You didn't. That matters.`,
    () => `There's a contradiction in what you shared — and I think you already know what it is. What is it?`,
    () => `If someone who truly knew you heard what you just said — what would they say back?`,
    () => `You've been holding that for a while, haven't you. Not just today.`,
    () => `What's the version of this you haven't let yourself say yet — even here?`,
  ];

  let messageCount = 0;

  function beginSession() {
    document.getElementById('welcomeScreen').classList.remove('active');
    document.getElementById('chatScreen').classList.add('active');
    document.getElementById('userInput').focus();
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function addMessage(text, type) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `message ${type}`;
    div.textContent = text;
    msgs.appendChild(div);
    setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 100);
  }

  function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    messageCount++;

    // Show typing
    const typing = document.getElementById('typingIndicator');
    typing.classList.add('active');

    setTimeout(() => {
      typing.classList.remove('active');

      // Pick reflection
      const reflectionFn = reflections[messageCount % reflections.length];
      const response = reflectionFn(text);
      addMessage(response, 'mirror');

      // Show pattern reflection after 3 messages
      if (messageCount === 3) {
        setTimeout(() => {
          const ref = document.getElementById('reflection');
          ref.textContent = `✦ A pattern I'm noticing — you speak about others clearly and precisely, but when it comes to yourself, the language softens. Something to sit with.`;
          ref.classList.add('visible');
        }, 800);
      }

    }, 1800 + Math.random() * 1000);
  }
</script>
</body>
</html>
