:root{color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#2b3b52;--text:#eef6ff;--muted:#9db0c7;--accent:#5dd6ff}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
main{max-width:1120px;margin:auto;padding:24px} h1{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2.4rem)}
p{color:var(--muted)} input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#0c1320;color:var(--text);font-size:1rem}
#summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0} .chip{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted)}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
article{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#080c12}
.content{padding:14px} h2{font-size:1.05rem;margin:0 0 5px} .meta{color:var(--muted);font-size:.88rem;margin-bottom:10px}
code{display:block;white-space:normal;overflow-wrap:anywhere;background:#090d14;border-radius:8px;padding:8px;margin-top:7px;color:var(--accent);font-size:.78rem}
button{margin-top:9px;border:1px solid var(--line);border-radius:9px;background:#142238;color:var(--text);padding:8px 10px;cursor:pointer}
.ok{color:#8ff0b1} .warn{color:#ffd27a}
</style>

<script>
const catalog=JSON.parse(document.getElementById('catalog').textContent); const grid=document.getElementById('grid'); const search=document.getElementById('search');
document.getElementById('summary').innerHTML=`<span class="chip">${catalog.asset_count} assets</span><span class="chip">${catalog.project_id}</span><span class="chip">runtime-contract first</span>`;
function render(){const q=search.value.trim().toLowerCase(); grid.innerHTML=''; catalog.assets.filter(a=>JSON.stringify(a).toLowerCase().includes(q)).forEach(a=>{
 const card=document.createElement('article'); const status=(a.performance_status||'UNKNOWN').toLowerCase();
 card.innerHTML=`${a.hero_preview?`<img src="${a.hero_preview}" alt="${a.name} preview">`:''}<div class="content"><h2>${a.name}</h2><div class="meta">${a.asset_id} · v${a.version} · <span class="${status==='pass'?'ok':'warn'}">${a.performance_status}</span><br>${a.lod0_faces} faces · ${a.game_glb_bytes} GLB bytes</div><code>${a.runtime_manifest}</code><code>${a.lod0}</code><button type="button">Select contract path</button></div>`;
 card.querySelector('button').addEventListener('click',()=>{const range=document.createRange();range.selectNode(card.querySelector('code'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);}); grid.appendChild(card);
});}
search.addEventListener('input',render); render();
</script></body></html>
