name: Feature request
description: Propose a useful direction, module, hand, or improvement.
title: "[Idea]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: need
    attributes:
      label: What need or problem does this address?
      description: Begin with the real use case rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a human or machine be able to do afterward?
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: How does this fit AXM's modular structure?
      description: Name an existing room, seam, module family, or a genuinely missing boundary.
  - type: textarea
    id: boundaries
    attributes:
      label: Important boundaries
      description: Note privacy, permission, hardware, safety, accessibility, offline, or licensing needs.
  - type: textarea
    id: evidence
    attributes:
      label: How could we honestly verify it?
      description: Describe the test, observation, or human judgment that would count.
