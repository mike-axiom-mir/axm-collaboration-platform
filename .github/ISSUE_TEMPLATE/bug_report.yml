name: Bug report
description: Report behavior that differs from an AXM claim or expected route.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing AXM. Never include passwords, tokens, private logs, personal data, or private session URLs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Beginner launcher or installation
        - Hub or navigation
        - Workshop module
        - Game or controller
        - AI or optional connector
        - Packaging or verification
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the exact visible error when it is safe to share.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: AXM tag or commit, source/package route, device, and operating system
      placeholder: v0.6.0-experimental tagged source ZIP, Windows 11 laptop
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add a cropped screenshot or short non-sensitive log excerpt if useful.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, personal data, private paths, and private session links.
          required: true
