name: AXM Code Language Organs Gate

on:
  push:
    paths:
      - "shared/code-capability-fabric/language-organs/**"
      - "shared/code-capability-fabric/module.contract.json"
      - ".github/ci/code-language-toolchain-probe.js"
      - ".github/ci/code-language-tree-sitter-pack-probe.py"
      - ".github/ci/code-language-tree-sitter-pack-probe-v2.py"
      - ".github/ci/code-language-last-mile-probe.py"
      - ".github/ci/code-language-coverage-union.py"
      - ".github/workflows/code-language-organs-gate.yml"
  pull_request:
    paths:
      - "shared/code-capability-fabric/language-organs/**"
      - "shared/code-capability-fabric/module.contract.json"
      - ".github/ci/code-language-toolchain-probe.js"
      - ".github/ci/code-language-tree-sitter-pack-probe.py"
      - ".github/ci/code-language-tree-sitter-pack-probe-v2.py"
      - ".github/ci/code-language-last-mile-probe.py"
      - ".github/ci/code-language-coverage-union.py"
      - ".github/workflows/code-language-organs-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-organs:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check out exact review source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check registry syntax
        run: node --check shared/code-capability-fabric/language-organs/registry.js
      - name: Refuse generated grammar-profile drift
        run: python3 shared/code-capability-fabric/language-organs/build-grammar-profiles.py --check
      - name: Verify 102 grammar-specific profiles and main planner bindings
        run: node shared/code-capability-fabric/language-organs/selftest-grammar-profiles.js
      - name: Run core organ contract test
        run: node shared/code-capability-fabric/language-organs/selftest.js
      - name: Run adversarial routing and snapshot test
        run: node shared/code-capability-fabric/language-organs/selftest-adversarial.js
      - name: Verify exact PR51 donor bindings
        run: node shared/code-capability-fabric/language-organs/selftest-donors.js
      - name: Census native toolchains and bounded smoke probes
        env:
          AXM_TOOLCHAIN_REPORT: toolchain-census.json
        run: node .github/ci/code-language-toolchain-probe.js
      - name: Preserve toolchain census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-language-toolchain-census
          path: toolchain-census.json
          if-no-files-found: error
          retention-days: 1

  structural-grammar-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact review source
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact grammar-pack version
        run: python -m pip install --disable-pip-version-check --no-input "tree-sitter-language-pack==1.14.3"
      - name: Parse all 102 organ fixtures through selected grammars
        env:
          AXM_GRAMMAR_REPORT: tree-sitter-grammar-census.json
        run: python .github/ci/code-language-tree-sitter-pack-probe-v2.py
      - name: Preserve structural grammar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-language-tree-sitter-grammar-census
          path: tree-sitter-grammar-census.json
          if-no-files-found: error
          retention-days: 1

  last-mile-nine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact review source
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use Node.js 24 for current parser packages
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Ubuntu compiler/interpreter front-ends
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnucobol3 raku
      - name: Install exact Python parser/compiler front-ends
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            "vyper==0.4.3" \
            "dax-sql-parser==0.1.0" \
            "sqlfluff==4.3.0" \
            "tree-sitter==0.26.0" \
            "tree-sitter-iec61131-3-st==0.1.2"
      - name: Install exact Node parser front-ends
        run: |
          mkdir -p /tmp/axm-node-probe
          npm install --prefix /tmp/axm-node-probe --no-audit --no-fund --ignore-scripts=false \
            "@abaplint/cli@2.120.31" \
            "@microsoft/powerquery-parser@0.19.0" \
            "tree-sitter-cli@0.26.9" \
            "github:jbearak/tree-sitter-stata#a47d1bb771d45da5058953f5d935759fac16d854"
          echo "/tmp/axm-node-probe/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run nine-organ last-mile probe
        env:
          AXM_NODE_PROBE_ROOT: /tmp/axm-node-probe
          AXM_LAST_MILE_REPORT: last-mile-census.json
        run: python .github/ci/code-language-last-mile-probe.py
      - name: Preserve last-mile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-language-last-mile-census
          path: last-mile-census.json
          if-no-files-found: error
          retention-days: 1

  coverage-union:
    needs: [language-organs, structural-grammar-pack, last-mile-nine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact review source
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download stock native evidence
        uses: actions/download-artifact@v4
        with:
          name: code-language-toolchain-census
          path: evidence/toolchain
      - name: Download structural grammar evidence
        uses: actions/download-artifact@v4
        with:
          name: code-language-tree-sitter-grammar-census
          path: evidence/grammar
      - name: Download last-mile evidence
        uses: actions/download-artifact@v4
        with:
          name: code-language-last-mile-census
          path: evidence/last-mile
      - name: Refuse anything below exact 102-organ coverage
        env:
          AXM_EVIDENCE_ROOT: evidence
          AXM_UNION_REPORT: code-language-coverage-union.json
        run: python .github/ci/code-language-coverage-union.py
      - name: Preserve exact 102-organ union evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-language-coverage-union
          path: code-language-coverage-union.json
          if-no-files-found: error
          retention-days: 1
