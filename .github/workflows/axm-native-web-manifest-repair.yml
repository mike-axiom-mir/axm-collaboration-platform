name: One-shot AXM native web manifest repair

on:
  push:
    branches:
      - codex/axm-native-web-engine-phase1-20260823
    paths:
      - 'projects/axm-native-web-engine-experimental/**'
      - '.github/workflows/axm-native-web-manifest-repair.yml'

permissions:
  contents: write

concurrency:
  group: axm-native-web-manifest-repair
  cancel-in-progress: false

jobs:
  repair-manifest-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/axm-native-web-engine-phase1-20260823
          fetch-depth: 0
      - name: Use declared Node.js line
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
      - name: Regenerate source manifest with project generator
        working-directory: projects/axm-native-web-engine-experimental
        run: node scripts/build-source-manifest.js --write
      - name: Refuse any generated change outside the manifest
        shell: bash
        run: |
          changed="$(git status --porcelain --untracked-files=no | awk '{print $2}')"
          if [ -z "$changed" ]; then
            echo 'manifest already exact; no commit needed'
            exit 0
          fi
          if [ "$changed" != 'projects/axm-native-web-engine-experimental/manifests/source-manifest.json' ]; then
            echo "refusing unexpected generated changes: $changed" >&2
            exit 1
          fi
      - name: Commit exact generated manifest if changed
        shell: bash
        run: |
          if git diff --quiet -- projects/axm-native-web-engine-experimental/manifests/source-manifest.json; then
            echo 'no manifest diff'
            exit 0
          fi
          git config user.name 'AXM Manifest Repair'
          git config user.email 'manifest-repair@axm.invalid'
          git add -- projects/axm-native-web-engine-experimental/manifests/source-manifest.json
          git commit -m 'chore: regenerate native web source manifest'
          git push origin HEAD:codex/axm-native-web-engine-phase1-20260823
