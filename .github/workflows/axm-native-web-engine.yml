name: Verify AXM native web engine

on:
  pull_request:
    paths:
      - 'projects/axm-native-web-engine-experimental/**'
      - '.github/scripts/verify-axm-native-web-session.js'
      - '.github/scripts/audit-axm-native-web-security.js'
      - '.github/scripts/validate-axm-native-web-schemas.py'
      - '.github/workflows/axm-native-web-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/axm-native-web-engine-experimental
    steps:
      - name: Check out the browser candidate
        uses: actions/checkout@v4
      - name: Use the declared Node.js line
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
      - name: Use independent schema-validator Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned independent JSON Schema engine
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
      - name: Verify browser tests
        run: node --test tests/*.test.js
      - name: Verify schemas
        run: node scripts/verify-schemas.js
      - name: Independently validate Draft 2020-12 schemas and artifacts
        run: python ../../.github/scripts/validate-axm-native-web-schemas.py . --selftest
      - name: Verify committed examples
        run: node scripts/build-examples.js --verify
      - name: Independently verify committed browser session
        run: node ../../.github/scripts/verify-axm-native-web-session.js golden/local-session.navigation.json --selftest
      - name: Independently audit native web security surface
        run: node ../../.github/scripts/audit-axm-native-web-security.js . --selftest
      - name: Verify helper syntax
        run: |
          find . -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check ../../.github/scripts/verify-axm-native-web-session.js
          node --check ../../.github/scripts/audit-axm-native-web-security.js
          python -m py_compile ../../.github/scripts/validate-axm-native-web-schemas.py
      - name: Verify source manifest
        id: source_manifest
        run: node scripts/build-source-manifest.js --verify
      - name: Build source-manifest repair candidate
        if: ${{ failure() && steps.source_manifest.outcome == 'failure' }}
        run: node scripts/build-source-manifest.js --write
      - name: Preserve source-manifest repair candidate
        if: ${{ failure() && steps.source_manifest.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: axm-native-web-source-manifest-repair-candidate
          path: projects/axm-native-web-engine-experimental/manifests/source-manifest.json
          if-no-files-found: error
          retention-days: 14

  browser-engine-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/axm-native-web-engine-experimental
    steps:
      - name: Check out the browser candidate
        uses: actions/checkout@v4
      - name: Use the declared Node.js line
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
      - name: Use independent schema-validator Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned independent JSON Schema engine
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
      - name: Verify browser package on native Windows paths
        run: npm run verify
      - name: Independently validate schemas and committed artifacts
        run: python ../../.github/scripts/validate-axm-native-web-schemas.py . --selftest
      - name: Independently verify committed browser session
        run: node ../../.github/scripts/verify-axm-native-web-session.js golden/local-session.navigation.json --selftest
      - name: Independently audit native web security surface
        run: node ../../.github/scripts/audit-axm-native-web-security.js . --selftest
      - name: Verify helper syntax on Windows
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Filter *.js
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node --check ../../.github/scripts/verify-axm-native-web-session.js
          node --check ../../.github/scripts/audit-axm-native-web-security.js
          python -m py_compile ../../.github/scripts/validate-axm-native-web-schemas.py
