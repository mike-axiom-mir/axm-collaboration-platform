name: Unpack AXM public archive

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unpack-public-archive.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack the public-safe archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="AXM_WORKSHOP_v1_9_1_TOOL_FACTORY_v0_2c_PUBLIC_SAFE_EXPERIMENTAL_TEST_LABEL.zip"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "Archive not found: $ARCHIVE"
            exit 1
          fi

          unzip -t "$ARCHIVE"

          rm -rf .axm-unpack
          mkdir .axm-unpack
          unzip -q "$ARCHIVE" -d .axm-unpack

          if [[ ! -d .axm-unpack/AXM_WORKSHOP ]]; then
            echo "Expected AXM_WORKSHOP folder was not found inside the archive."
            exit 1
          fi

          # Replace the temporary repository contents with the package contents.
          # .git and the extraction folder are preserved until copying finishes.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .axm-unpack \
            -exec rm -rf {} +

          cp -a .axm-unpack/AXM_WORKSHOP/. .
          rm -rf .axm-unpack

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed after extraction."
            exit 0
          fi

          git commit -m "Unpack AXM Workshop public-safe package"
          git push origin HEAD:main
