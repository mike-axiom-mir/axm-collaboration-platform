# second-push trigger: workflow already exists on branch before this event
name: AXM Language Specialist Eye Steward Regen

on:
  push:
    branches:
      - codex/code-capability-fabric-language-organs-v1
    paths:
      - ".github/workflows/language-specialist-eye-steward-regen.yml"
      - "shared/code-capability-fabric/language-organs/build-specialist-eyes.py"
      - "shared/code-capability-fabric/language-organs/human-developer-perspective.json"
      - "shared/code-capability-fabric/language-organs/specialist-eye-registry.js"
      - "shared/code-capability-fabric/language-organs/code-native-discovery-seam.js"
      - "shared/code-capability-fabric/language-organs/selftest-specialist-eyes.js"

concurrency:
  group: axm-language-specialist-eye-steward-regen
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-specialist-eyes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@v4
        with:
          ref: codex/code-capability-fabric-language-organs-v1
          fetch-depth: 1
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Materialize exact per-organ specialist eyes
        run: |
          python shared/code-capability-fabric/language-organs/build-specialist-eyes.py --write
          python shared/code-capability-fabric/language-organs/build-specialist-eyes.py --check
          node shared/code-capability-fabric/language-organs/selftest-specialist-eyes.js
      - name: Re-run grammar and organ contracts
        run: |
          python shared/code-capability-fabric/language-organs/build-grammar-profiles.py --check
          node shared/code-capability-fabric/language-organs/selftest-grammar-profiles.js
          node shared/code-capability-fabric/language-organs/selftest.js
          node shared/code-capability-fabric/language-organs/selftest-adversarial.js
          node shared/code-capability-fabric/language-organs/selftest-donors.js
      - name: Regenerate deterministic repository views
        run: |
          node scripts/compile-city-graph.js --write
          node scripts/compile-schema-registry.js --write
          node scripts/compile-twin-surfaces.js --write
          node scripts/compile-city-graph.js --check
          node scripts/compile-schema-registry.js --check
          node scripts/compile-twin-surfaces.js --check
      - name: Run repository verification
        run: |
          node verify.js
          node hub/hub-selftest.js
          node hub/route-selftest.js
          node hub/graft-selftest.js
          node hub/skin-selftest.js
          node hub/verify-plus.js
          git diff --check
      - name: Commit only specialist eyes and deterministic derived views
        run: |
          git config user.name "AXM Specialist Eye Steward Gate"
          git config user.email "specialist-eye-steward@axm.invalid"
          git add shared/code-capability-fabric/language-organs/organs/*/specialist.eye.json
          git add registry/generated docs/generated/LEGO_CITY_MAP.md docs/generated/LEGO_CITY_BEGINNER_MAP.md
          if git diff --cached --quiet; then
            echo "No generated specialist-eye changes to commit."
          else
            git commit -m "feat(fabric): materialize 102 code-native specialist eyes"
            git push origin HEAD:codex/code-capability-fabric-language-organs-v1
          fi
