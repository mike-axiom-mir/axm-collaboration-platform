name: Bootstrap AXM v0.6.1 corrective branch

on:
  push:
    branches:
      - agent/post-v0.6.0-audit-v0.6.1

permissions:
  contents: write

concurrency:
  group: bootstrap-v061-corrective
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact corrective branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/post-v0.6.0-audit-v0.6.1

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: npm

      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Reconstruct and apply exact corrective migration
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.v061-patch/part-*.txt | tr -d '\r\n' > /tmp/axm-v061-patch.b64
          echo "0c4b7c06a1610eae8a270a1a30d6ec18651c1dec403bc9b56ed765d5da967481  /tmp/axm-v061-patch.b64" | sha256sum --check -
          base64 --decode /tmp/axm-v061-patch.b64 > /tmp/axm-v061-patch.js.gz
          gzip --decompress --stdout /tmp/axm-v061-patch.js.gz > scripts/apply-v0.6.1-corrective-patch.js
          echo "e3acb97b2beee58cccd24f58b042df394e1db3ef84330082cda9c0e8849a533b  scripts/apply-v0.6.1-corrective-patch.js" | sha256sum --check -
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-v0.6.1-corrective-patch.js')
          text = path.read_text()
          old = "portableSource.includes('refuseExisting: true')"
          new = r"/refuseExisting\\s*:\\s*true/.test(portableSource)"
          if text.count(old) != 1:
              raise SystemExit('expected one portable receipt assertion to repair')
          path.write_text(text.replace(old, new))
          PY
          echo "7af227aaf26cb01ff44bf5f95c2a5387c58ccb03aa27d1ae0619f0724827b836  scripts/apply-v0.6.1-corrective-patch.js" | sha256sum --check -
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-v0.6.1-corrective-patch.js')
          text = path.read_text()
          old = "Core.stable(Object.keys(ref).sort()) === Core.stable(['surface','locator','digest'])"
          new = "Core.stable(Object.keys(ref).sort()) === Core.stable(['surface','locator','digest'].sort())"
          if text.count(old) != 1:
              raise SystemExit('expected one compute evidence-key assertion to repair')
          path.write_text(text.replace(old, new))
          PY
          echo "01648502e3f967a09e7c2948143a30ac19abc53294e9f5c5e34d8e86d1cf155c  scripts/apply-v0.6.1-corrective-patch.js" | sha256sum --check -
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-v0.6.1-corrective-patch.js')
          text = path.read_text()
          replacements = [
              (
                  "const computeVerify = `function verify(pkg) {\\n  try {\\n    Core.assert(pkg && pkg.schema === PACKAGE_SCHEMA, 'compute package schema is unsupported');\\n    const copy = Core.clone(pkg), digest = copy.packageDigest; delete copy.packageDigest;\\n    Core.assert(/^[a-f0-9]{64}$/.test(String(digest || '')) && Core.digest(copy) === digest, 'compute package digest mismatch');\\n",
                  "const computeVerify = `function verify(pkg, trustedAnchors) {\\n  try {\\n    Core.assert(pkg && pkg.schema === PACKAGE_SCHEMA, 'compute package schema is unsupported');\\n    const copy = Core.clone(pkg), digest = copy.packageDigest; delete copy.packageDigest;\\n    Core.assert(/^[a-f0-9]{64}$/.test(String(digest || '')) && Core.digest(copy) === digest, 'compute package digest mismatch');\\n    const anchors = trustedAnchors && typeof trustedAnchors === 'object' && !Array.isArray(trustedAnchors) ? trustedAnchors : {};\\n    Core.assert(Object.keys(anchors).every(key => ['expectedPackageDigest','expectedRootStateDigest'].includes(key)), 'unsupported trusted compute anchor');\\n    let anchorState = 'UNANCHORED';\\n    if (anchors.expectedPackageDigest !== undefined) {\\n      Core.assert(/^[a-f0-9]{64}$/.test(String(anchors.expectedPackageDigest || '')), 'trusted expected package digest is invalid');\\n      Core.assert(digest === anchors.expectedPackageDigest, 'trusted package digest anchor mismatch');\\n      anchorState = 'PACKAGE_DIGEST_MATCH';\\n    }\\n",
              ),
              (
                  "    Core.assert(Core.digest({ selected:pkg.root.selected, history:pkg.root.history }) === pkg.root.rootStateDigest, 'root state digest mismatch');\\n    Core.assert((pkg.architectures || []).every(item => item.state === 'PROPOSED' && item.deploymentAuthority === false), 'architecture authority boundary changed');\\n",
                  "    Core.assert(Core.digest({ selected:pkg.root.selected, history:pkg.root.history }) === pkg.root.rootStateDigest, 'root state digest mismatch');\\n    if (anchors.expectedRootStateDigest !== undefined) {\\n      Core.assert(/^[a-f0-9]{64}$/.test(String(anchors.expectedRootStateDigest || '')), 'trusted expected root-state digest is invalid');\\n      Core.assert(pkg.root.rootStateDigest === anchors.expectedRootStateDigest, 'trusted root-state digest anchor mismatch');\\n      anchorState = anchorState === 'PACKAGE_DIGEST_MATCH' ? 'PACKAGE_AND_ROOT_MATCH' : 'ROOT_STATE_DIGEST_MATCH';\\n    }\\n    Core.assert((pkg.architectures || []).every(item => item.state === 'PROPOSED' && item.deploymentAuthority === false), 'architecture authority boundary changed');\\n",
              ),
              (
                  "    return {pass:true,reason:null,digest};\\n  } catch (error) { return {pass:false,reason:error.message}; }\\n}",
                  "    return {pass:true,reason:null,digest,anchorState};\\n  } catch (error) { return {pass:false,reason:error.message,anchorState:'FAILED'}; }\\n}"
              ),
              (
                  "ok(Compute.verify(accepted).pass && accepted.root.selected.year === 1834, 'legitimate human decision replays to the selected root');",
                  "const acceptedVerification = Compute.verify(accepted, { expectedPackageDigest:accepted.packageDigest, expectedRootStateDigest:accepted.root.rootStateDigest });\\nok(acceptedVerification.pass && acceptedVerification.anchorState === 'PACKAGE_AND_ROOT_MATCH' && accepted.root.selected.year === 1834, 'legitimate human decision replays to the externally anchored selected root');",
              ),
              (
                  "ok(!Compute.verify(resealEvent(changedProposal, 0)).pass, 're-sealed event cannot substitute a different proposal after the decision');",
                  "const substitutedProposalPackage = resealEvent(changedProposal, 0);\\nconst unanchoredSubstitution = Compute.verify(substitutedProposalPackage);\\nok(unanchoredSubstitution.pass && unanchoredSubstitution.anchorState === 'UNANCHORED', 'self-contained replay labels a fully re-sealed alternate proposal as unanchored rather than authenticated');\\nok(!Compute.verify(substitutedProposalPackage, { expectedPackageDigest:accepted.packageDigest, expectedRootStateDigest:accepted.root.rootStateDigest }).pass, 'trusted external digests reject a re-sealed proposal substitution');",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('expected one trusted-anchor patch target: ' + old[:100])
              text = text.replace(old, new)
          path.write_text(text)
          PY
          echo "698206e6bd65e927f37fca127cd1c8a2a85db34d16e6bda39a305f72cd8b1e83  scripts/apply-v0.6.1-corrective-patch.js" | sha256sum --check -
          node --check scripts/apply-v0.6.1-corrective-patch.js
          node scripts/apply-v0.6.1-corrective-patch.js

      - name: Regenerate deterministic indexes and public discovery
        run: |
          node scripts/generate-tools-index.js
          node scripts/generate-public-discovery.js

      - name: Syntax-check every changed JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] || node --check "$file"
          done < <(git diff --name-only --diff-filter=ACM -- '*.js' '*.cjs' '*.mjs')

      - name: Run focused adversarial hardening tests
        run: node tests/v0.6.1-corrective-hardening-selftest.js

      - name: Verify regenerated discovery
        run: npm run discovery:verify

      - name: Run root verifier and strict live warning delta
        run: |
          node verify.js
          node tools/repairbuddy/repairbuddy-cli.js warning-delta --strict --json

      - name: Verify public GitHub and Pages surfaces
        run: npm run test:public-surface

      - name: Commit only the verified corrective result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AXM corrective gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Corrective migration produced no staged changes.' >&2
            exit 1
          fi
          git commit -m 'fix: harden v0.6.1 corrective release'
          git push origin HEAD:agent/post-v0.6.0-audit-v0.6.1
