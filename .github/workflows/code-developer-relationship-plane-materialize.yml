name: AXM Code Developer Relationship Plane Materializer

on:
  pull_request:
    branches:
      - codex/code-artifact-build-window-v1
    paths:
      - ".github/workflows/code-developer-relationship-plane-materialize.yml"
      - "shared/code-capability-fabric/language-organs/code-developer-relationship-plane.js"
      - "shared/code-capability-fabric/language-organs/code-developer-diagnostics.js"
      - "shared/code-capability-fabric/language-organs/developer-substrate-atlas.json"
      - "shared/code-capability-fabric/language-organs/developer-relationship-plane.contract.json"
      - "shared/code-capability-fabric/language-organs/selftest-developer-relationship-plane.js"

concurrency:
  group: axm-code-developer-relationship-plane-materialize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-developer-relationship-plane:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@v4
        with:
          ref: codex/code-developer-relationship-plane-v1
          fetch-depth: 1
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prove developer relationship plane
        run: node shared/code-capability-fabric/language-organs/selftest-developer-relationship-plane.js
      - name: Patch Code Fabric contract to v0.12
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'shared/code-capability-fabric/module.contract.json';
          const c = JSON.parse(fs.readFileSync(p, 'utf8'));
          const add = (arr, values) => { for (const v of values) if (!arr.includes(v)) arr.push(v); };
          c.version = 'v0.12';
          add(c.provides, [
            'axm.code.developer-substrate-atlas.v1',
            'axm.code.developer-relationship-graph.v1',
            'axm.code.change-impact-report.v1',
            'axm.code.reanalysis-plan.v1',
            'axm.code.diagnostic-finding.v1',
            'axm.code.diagnostic-batch.v1',
            'axm.code.action-identity.v1',
            'axm.code.action-cache-decision.v1',
            'axm.code.dependency-diff.v1',
            'axm.code.impact-preview.v1',
            'axm.code.developer-substrate-snapshot.v1'
          ]);
          add(c.consumes, [
            'caller-supplied developer relationship nodes and edges',
            'caller-supplied changed entity identifiers',
            'caller-supplied build action identity digests',
            'caller-supplied before/after dependency snapshots',
            'LSP diagnostic evidence',
            'SARIF 2.1.0 analysis evidence',
            'optional AXM dependency declaration map evidence',
            'optional AXM diagnostic evidence',
            'optional build-system/project graph evidence',
            'optional test/coverage relationship evidence',
            'optional data-flow/path evidence'
          ]);
          add(c.handoffs.emits, [
            'axm.code.developer-relationship-graph.v1',
            'axm.code.change-impact-report.v1',
            'axm.code.reanalysis-plan.v1',
            'axm.code.diagnostic-batch.v1',
            'axm.code.action-cache-decision.v1',
            'axm.code.dependency-diff.v1',
            'axm.code.developer-substrate-snapshot.v1'
          ]);
          add(c.handoffs.accepts, [
            'caller-supplied developer relationship observation',
            'caller-supplied changed entity ids',
            'caller-supplied LSP diagnostics',
            'caller-supplied SARIF 2.1.0 results',
            'caller-supplied build/package/test/data-flow evidence'
          ]);
          add(c.boundaries.refuses, [
            'developer-relationship-edge-as-semantic-correctness-proof',
            'missing-developer-relationship-edge-as-no-relationship-proof',
            'partial-developer-graph-as-complete-impact-proof',
            'affected-node-as-broken-code-proof',
            'unaffected-node-as-safe-code-proof',
            'observed-code-cycle-as-defect-proof',
            'diagnostic-finding-as-correctness-proof',
            'no-diagnostic-as-bug-free-proof',
            'data-flow-path-as-exploitability-proof',
            'cache-identity-match-as-correct-output-proof',
            'automatic-cache-read-or-write-from-developer-plane',
            'automatic-build-or-test-execution-from-impact',
            'dependency-delta-as-automatic-rejection',
            'automatic-source-mutation-from-developer-plane',
            'automatic-repair-from-developer-plane',
            'automatic-admission-change-from-developer-plane',
            'automatic-promotion-from-developer-plane'
          ]);
          fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          NODE
      - name: Preserve accumulated grammar intelligence
        run: |
          node shared/code-capability-fabric/language-organs/selftest-code-artifact-build-window.js
          node shared/code-capability-fabric/language-organs/build-machine-keyboards.js --check
          node shared/code-capability-fabric/language-organs/selftest-machine-code-keyboard.js
          node shared/code-capability-fabric/language-organs/selftest-prebuild-twin-admission.js
          node shared/code-capability-fabric/language-organs/selftest-code-route-knowledge.js
          node shared/code-capability-fabric/language-organs/selftest-human-discipline-perspectives.js
          node shared/code-capability-fabric/language-organs/build-machine-templates.js --check
          node shared/code-capability-fabric/language-organs/selftest-machine-templates.js
          node shared/code-capability-fabric/language-organs/build-machine-cheatcodes.js --check
          node shared/code-capability-fabric/language-organs/selftest-machine-cheatcodes.js
          node shared/code-capability-fabric/language-organs/selftest-machine-cheatcode-influence.js
          python shared/code-capability-fabric/language-organs/build-grammar-profiles.py --check
          python shared/code-capability-fabric/language-organs/build-specialist-eyes.py --check
          node shared/code-capability-fabric/language-organs/selftest-grammar-profiles.js
          node shared/code-capability-fabric/language-organs/selftest-specialist-eyes.js
      - name: Regenerate deterministic repository views
        run: |
          node scripts/compile-city-graph.js --write
          node scripts/compile-schema-registry.js --write
          node scripts/compile-twin-surfaces.js --write
          node scripts/compile-city-graph.js --check
          node scripts/compile-schema-registry.js --check
          node scripts/compile-twin-surfaces.js --check
      - name: Verify repository
        run: |
          node verify.js
          node hub/hub-selftest.js
          node hub/route-selftest.js
          node hub/graft-selftest.js
          node hub/skin-selftest.js
          node hub/verify-plus.js
          git diff --check
      - name: Commit only contract and deterministic generated views
        run: |
          git config user.name "AXM Developer Relationship Steward Gate"
          git config user.email "developer-relationship-steward@axm.invalid"
          git add shared/code-capability-fabric/module.contract.json
          git add registry/generated docs/generated/LEGO_CITY_MAP.md docs/generated/LEGO_CITY_BEGINNER_MAP.md
          if git diff --cached --quiet; then
            echo "No developer relationship contract/view changes to commit."
          else
            git commit -m "chore(fabric): expose developer relationship plane and refresh views"
            git push origin HEAD:codex/code-developer-relationship-plane-v1
          fi
