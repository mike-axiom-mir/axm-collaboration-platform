name: Remove consolidated AXM branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-consolidated-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every remote branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name')

          deleted=0
          failed=0
          echo "Branches before cleanup:"
          printf ' - %s\n' "${branches[@]}"

          for branch in "${branches[@]}"; do
            if [ "$branch" = "main" ]; then
              continue
            fi

            encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"; then
              echo "Deleted: $branch"
              deleted=$((deleted + 1))
            else
              echo "FAILED: $branch"
              failed=$((failed + 1))
            fi
          done

          echo "DELETED_COUNT=$deleted" >> "$GITHUB_ENV"
          echo "FAILED_COUNT=$failed" >> "$GITHUB_ENV"

          if [ "$failed" -ne 0 ]; then
            echo "$failed branch deletion(s) failed; leaving this workflow in place for diagnosis."
            exit 1
          fi

          remaining=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name')
          echo "Branches after cleanup:"
          echo "$remaining"
          test "$remaining" = "main"

      - name: Remove one-time cleanup workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-consolidated-branches.yml
          git commit -m "Remove one-time branch cleanup workflow after deleting ${DELETED_COUNT} branches"
          git push origin main
