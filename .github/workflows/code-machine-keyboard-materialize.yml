name: AXM Code Machine Keyboard Materializer

on:
  pull_request:
    branches:
      - codex/code-prebuild-twin-admission-v1
    paths:
      - ".github/workflows/code-machine-keyboard-materialize.yml"
      - "shared/code-capability-fabric/language-organs/machine-code-keyboard-fabric.js"
      - "shared/code-capability-fabric/language-organs/machine-code-keyboard-router.js"
      - "shared/code-capability-fabric/language-organs/build-machine-keyboards.js"
      - "shared/code-capability-fabric/language-organs/machine-code-keyboard.contract.json"
      - "shared/code-capability-fabric/language-organs/selftest-machine-code-keyboard.js"
      - "shared/code-capability-fabric/module.contract.json"

concurrency:
  group: axm-code-machine-keyboard-materialize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-machine-keyboards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@v4
        with:
          ref: codex/code-machine-keyboard-v1
          fetch-depth: 1
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Materialize 102 physical machine keyboard banks
        run: |
          node shared/code-capability-fabric/language-organs/build-machine-keyboards.js
          node shared/code-capability-fabric/language-organs/build-machine-keyboards.js --check
      - name: Prove machine keyboard and hotboard
        run: node shared/code-capability-fabric/language-organs/selftest-machine-code-keyboard.js
      - name: Preserve prebuild twin and admission ground
        run: node shared/code-capability-fabric/language-organs/selftest-prebuild-twin-admission.js
      - name: Preserve route and discipline layers
        run: |
          node shared/code-capability-fabric/language-organs/selftest-code-route-knowledge.js
          node shared/code-capability-fabric/language-organs/selftest-human-discipline-perspectives.js
      - name: Preserve template fabric
        run: |
          node shared/code-capability-fabric/language-organs/build-machine-templates.js --check
          node shared/code-capability-fabric/language-organs/selftest-machine-templates.js
      - name: Preserve cheatcode and influence fabric
        run: |
          node shared/code-capability-fabric/language-organs/build-machine-cheatcodes.js --check
          node shared/code-capability-fabric/language-organs/selftest-machine-cheatcodes.js
          node shared/code-capability-fabric/language-organs/selftest-machine-cheatcode-influence.js
      - name: Preserve grammar and specialist-eye foundation
        run: |
          python shared/code-capability-fabric/language-organs/build-grammar-profiles.py --check
          python shared/code-capability-fabric/language-organs/build-specialist-eyes.py --check
          node shared/code-capability-fabric/language-organs/selftest-grammar-profiles.js
          node shared/code-capability-fabric/language-organs/selftest-specialist-eyes.js
      - name: Regenerate deterministic repository views
        run: |
          node scripts/compile-city-graph.js --write
          node scripts/compile-schema-registry.js --write
          node scripts/compile-twin-surfaces.js --write
          node scripts/compile-city-graph.js --check
          node scripts/compile-schema-registry.js --check
          node scripts/compile-twin-surfaces.js --check
      - name: Run repository verification
        run: |
          node verify.js
          node hub/hub-selftest.js
          node hub/route-selftest.js
          node hub/graft-selftest.js
          node hub/skin-selftest.js
          node hub/verify-plus.js
          git diff --check
      - name: Commit only keyboards and deterministic generated views
        run: |
          git config user.name "AXM Machine Keyboard Steward Gate"
          git config user.email "machine-keyboard-steward@axm.invalid"
          git add shared/code-capability-fabric/language-organs/organs/*/machine.keyboard.json
          git add registry/generated docs/generated/LEGO_CITY_MAP.md docs/generated/LEGO_CITY_BEGINNER_MAP.md
          if git diff --cached --quiet; then
            echo "No generated machine-keyboard/view changes to commit."
          else
            git commit -m "chore(fabric): materialize grammar machine keyboards and views"
            git push origin HEAD:codex/code-machine-keyboard-v1
          fi
