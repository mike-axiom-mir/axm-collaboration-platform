name: AXM LEGO City Map Gate

on:
  pull_request:
    paths:
      - "tools/**"
      - "shared/**"
      - "worlds/**"
      - "registry/generated/**"
      - "docs/generated/LEGO_CITY_MAP.md"
      - "scripts/compile-city-graph.js"
      - "scripts/compile-schema-registry.js"
      - "scripts/compile-twin-surfaces.js"
      - "tests/city-map-gate-test.js"
      - "tests/schema-registry-gate-test.js"
      - "tests/city-state-primitives-test.js"
      - "tests/city-authority-hands-test.js"
      - "tests/city-workflow-evidence-test.js"
      - "tests/city-sync-twins-test.js"
      - "tests/city-intake-gates-test.js"
      - "tests/lego-city-blueprint-conformance-test.js"
      - ".github/workflows/city-map-gate.yml"

concurrency:
  group: axm-city-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  city-map:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 83 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'automation/truth-sentinel-hermes-evidence-admission-20260910'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
      - name: Regenerate compiler-owned views only
        run: |
          node scripts/compile-city-graph.js --write
          node scripts/compile-schema-registry.js --write
          node scripts/compile-twin-surfaces.js --write
          git diff --name-only -- registry/generated docs/generated
      - name: Commit exact generated delta to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- registry/generated docs/generated/LEGO_CITY_MAP.md docs/generated/LEGO_CITY_BEGINNER_MAP.md
          if git diff --cached --quiet; then
            echo 'No generated delta to commit.'
          else
            git commit -m 'chore: refresh generated City views for Hermes evidence admission'
            git push origin HEAD:refs/heads/automation/truth-sentinel-hermes-evidence-admission-20260910
          fi
      - name: Run focused negative and boundary tests
        run: node tests/city-map-gate-test.js
      - name: Refuse omitted modules and generated-view drift
        run: node scripts/compile-city-graph.js --check
      - name: Refuse schema identity and registry drift
        run: node tests/schema-registry-gate-test.js && node scripts/compile-schema-registry.js --check
      - name: Prove immutable artifact and append-only event boundaries
        run: node tests/city-state-primitives-test.js
      - name: Prove exact authority and injected-hand boundaries
        run: node tests/city-authority-hands-test.js
      - name: Prove durable route and evidence boundaries
        run: node tests/city-workflow-evidence-test.js
      - name: Prove local sync and exact human/machine twins
        run: node tests/city-sync-twins-test.js && node scripts/compile-twin-surfaces.js --check
      - name: Prove quarantine, disabled gates, and twelve-block coverage
        run: node tests/city-intake-gates-test.js && node tests/lego-city-blueprint-conformance-test.js
