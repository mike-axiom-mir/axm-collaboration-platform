name: AXM Code Language Template Materializer

on:
  pull_request:
    branches:
      - codex/code-language-machine-cheatcodes-v1
    paths:
      - ".github/workflows/code-language-template-materialize.yml"
      - "shared/code-capability-fabric/language-organs/machine-template-fabric.js"
      - "shared/code-capability-fabric/language-organs/template-pattern-miner.js"
      - "shared/code-capability-fabric/language-organs/template-fast-router.js"
      - "shared/code-capability-fabric/language-organs/build-machine-templates.js"
      - "shared/code-capability-fabric/language-organs/selftest-machine-templates.js"
      - "shared/code-capability-fabric/language-organs/template-fabric.contract.json"

concurrency:
  group: axm-code-language-template-materialize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-templates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@v4
        with:
          ref: codex/code-language-template-fabric-v1
          fetch-depth: 1
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Materialize 102 deep template banks
        run: |
          node shared/code-capability-fabric/language-organs/build-machine-templates.js --write
          node shared/code-capability-fabric/language-organs/build-machine-templates.js --check
          node shared/code-capability-fabric/language-organs/selftest-machine-templates.js
      - name: Preserve lower code-intelligence layers
        run: |
          node shared/code-capability-fabric/language-organs/build-machine-cheatcodes.js --check
          node shared/code-capability-fabric/language-organs/selftest-machine-cheatcodes.js
          node shared/code-capability-fabric/language-organs/selftest-machine-cheatcode-influence.js
          python shared/code-capability-fabric/language-organs/build-grammar-profiles.py --check
          python shared/code-capability-fabric/language-organs/build-specialist-eyes.py --check
          node shared/code-capability-fabric/language-organs/selftest-grammar-profiles.js
          node shared/code-capability-fabric/language-organs/selftest-specialist-eyes.js
      - name: Regenerate deterministic repository views
        run: |
          node scripts/compile-city-graph.js --write
          node scripts/compile-schema-registry.js --write
          node scripts/compile-twin-surfaces.js --write
          node scripts/compile-city-graph.js --check
          node scripts/compile-schema-registry.js --check
          node scripts/compile-twin-surfaces.js --check
      - name: Run repository verification
        run: |
          node verify.js
          node hub/hub-selftest.js
          node hub/route-selftest.js
          node hub/graft-selftest.js
          node hub/skin-selftest.js
          node hub/verify-plus.js
          git diff --check
      - name: Commit only generated template banks and deterministic views
        run: |
          git config user.name "AXM Template Fabric Steward Gate"
          git config user.email "template-fabric-steward@axm.invalid"
          git add shared/code-capability-fabric/language-organs/organs/*/machine.templates.json
          git add registry/generated docs/generated/LEGO_CITY_MAP.md docs/generated/LEGO_CITY_BEGINNER_MAP.md
          if git diff --cached --quiet; then
            echo "No generated template changes to commit."
          else
            git commit -m "feat(fabric): materialize 102 deep grammar template banks"
            git push origin HEAD:codex/code-language-template-fabric-v1
          fi
