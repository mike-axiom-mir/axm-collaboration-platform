name: Materialize AXM v0.6.1 corrective branch

on:
  push:
    branches:
      - codex/v0.6.1-release-hardening

permissions:
  contents: write

concurrency:
  group: axm-v061-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/v0.6.1-release-hardening

      - name: Use the declared Node.js line
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Expand the reviewed bootstrap bundle
        shell: bash
        run: |
          if [ -f tools/release-hardening/bootstrap-v0.6.1.js ]; then
            node tools/release-hardening/bootstrap-v0.6.1.js
          fi

      - name: Install declared dependencies
        run: npm ci

      - name: Materialize the reviewed corrective patch
        run: node tools/release-hardening/apply-v0.6.1.js

      - name: Remove transport-only applicator
        shell: bash
        run: |
          rm -f tools/release-hardening/apply-v0.6.1.js
          rmdir tools/release-hardening 2>/dev/null || true

      - name: Regenerate deterministic discovery surfaces
        run: |
          npm run index:tools
          npm run discovery:generate

      - name: Run focused source hardening tests
        run: |
          node tests/v0.6.1-hardening-selftest.js
          node tools/game-production-runner/selftest.js
          node tools/hardware-research-registry/selftest.js
          node tools/compute-substrate-lab/selftest.js
          node tools/deterministic-pr-publisher/selftest.js
          node verify.js

      - name: Refuse malformed generated changes
        run: |
          git diff --check
          node --check shared/game-production-runner/plain-file-io.js
          node --check tests/v0.6.1-hardening-selftest.js

      - name: Commit source, bind warning baseline, and publish final branch head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Corrective source was already materialized."
          else
            git commit -m "fix: materialize v0.6.1 release hardening"
          fi

          SOURCE_SHA="$(git rev-parse HEAD)"
          node verify.js
          SOURCE_SHA="$SOURCE_SHA" node <<'NODE'
          const fs = require('node:fs');
          const D = require('./tools/repairbuddy/verifier-warning-delta');
          const baselinePath = 'tools/repairbuddy/verifier-warning-baseline.json';
          const reportPath = 'exports/verify-report.json';
          const oldRaw = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const messages = D.messagesFromVerifyReport(report);
          const comparableOld = D.buildBaseline(oldRaw.id, oldRaw.messages, oldRaw.source);
          const migrationDelta = D.compareWarnings(messages, comparableOld);
          if (migrationDelta.added.length || migrationDelta.changed.length) {
            throw new Error('warning baseline migration would hide added or changed warnings: ' + JSON.stringify(migrationDelta.summary));
          }
          const next = D.buildBaseline(oldRaw.id, messages, {
            ref:'codex/v0.6.1-release-hardening',
            commit:process.env.SOURCE_SHA
          });
          fs.writeFileSync(baselinePath, JSON.stringify(next, null, 2) + '\n', 'utf8');
          console.log(JSON.stringify({
            baselineMigration:true,
            sourceCommit:process.env.SOURCE_SHA,
            previousWarnings:comparableOld.messages.length,
            currentWarnings:messages.length,
            resolved:migrationDelta.resolved.map(row => row.message)
          }, null, 2));
          NODE

          node tools/repairbuddy/selftest.js
          node tools/repairbuddy/repairbuddy-cli.js warning-delta --strict
          git diff --check

          git add -A
          if git diff --cached --quiet; then
            echo "Warning baseline was already bound."
          else
            git commit -m "chore: bind v0.6.1 warning baseline to verified source"
          fi

          git push origin HEAD:codex/v0.6.1-release-hardening
